function npAICreateBookFromForm(payload){
  if(!needKey()) return;
  busy('正在创作书籍，请稍后');
  const sys='你是中文网文平台的新书策划。只输出 JSON，不聊天。根据作者给出的方向生成一本书的包装信息，不要写正文。';
  const user='题材：'+(payload.genre||'')+'\n标签：'+(payload.tags||[]).join('、')+'\n人设：'+(payload.cpLine||'')+'\n性向：'+(payload.orientation||'无CP')+'\n结构：'+(payload.structure||'1V1')+'\n书名：'+(payload.title||'由你起名')+'\n创作想法：'+(payload.idea||'自由发挥')+'\n输出 JSON：{title,genre,tags,synopsis,announcement,cpLine,protagonists}。';
  callModel([{role:'system',content:sys},{role:'user',content:user}]).then(function(out){
    let item=npJSON(out); if(Array.isArray(item)) item=item[0]; if(!item||!item.title) throw new Error('AI 没有生成书名');
    const data={title:payload.title||item.title,genre:payload.genre||item.genre||'现代',tags:(payload.tags&&payload.tags.length)?payload.tags:(item.tags||[]),synopsis:payload.synopsis||item.synopsis||'',announcement:payload.announcement||item.announcement||'',cpLine:payload.cpLine||item.cpLine||'',protagonists:item.protagonists||[],orientation:payload.orientation,structure:payload.structure,idea:payload.idea,cover:payload.coverCustom?payload.cover:'',coverCustom:!!payload.coverCustom};
    const book=npNormalizeBook(Object.assign({id:uid(),authorId:'me',authorName:DB.np.author.penName,origin:'ai-author',published:false,chapters:[],status:'连载中',stats:{reads:0,favorites:0,comments:0,tips:0}},data));
    DB.books.push(book); save(); busyDone(); go('novelbook',book.id); toast('AI 书籍已创建');
  }).catch(function(e){ busyDone(); toast('生成失败：'+e.message); });
}

function npReplyText(text){
  const src=String(text||'').trim();
  if(/打脸|嘴硬|追妻|火葬场/.test(src)) return '对，就爱看嘴硬的人先挨一下打脸，后面才有意思。';
  if(/主角/.test(src)) return '主角越能憋，后面翻车的时候越好看。';
  if(/配角|副CP/.test(src)) return '配角线确实容易被写薄，希望作者多给一点戏份。';
  if(/为什么|怎么|是不是|吗|？|\?/.test(src)) return '我也想问这一点。'+ (src.includes('主角')?'感觉后面会因为这个翻车。':'但作者可能是在埋后面的伏笔。');
  if(/好看|喜欢|好嗑|爽/.test(src)) return '同感，我也被这段击中了。';
  if(/不好|难看|崩|烂/.test(src)) return '我倒觉得还能再看看，下一段可能就翻回来。';
  return pick(['你这么一说我也想起来了。','这句我记住了。','我也正好看到这里。','后面大概率还有反转。']);
}

function npGenerateParaComments(bookId,chapterId,pi,refresh){
  const b=npBook(bookId), ch=npChapter(b,chapterId); if(!b||!ch||!needKey()) return;

  const names=DB.np.readers.map(function(r){ return r.name+'（'+r.type+'）'; }).join('、');
  callModel([{role:'system',content:'你在模拟网文平台的段评。只输出 JSON 数组，不聊天。评论要短、有具体反应，像真实读者，不能复述整段原文。'},{role:'user',content:'书：'+b.title+'\n章节：'+ch.title+'\n当前段：'+para+'\n读者池：'+names+'\n生成 2 到 3 条段评，每项字段 readerName, readerType, text(8到45字)。不要代码块。'}]).then(function(out){
    let arr=npJSON(out); if(arr&&arr.comments) arr=arr.comments; if(!Array.isArray(arr)) arr=[arr];
    npApplyComments(ch,arr.slice(0,3).map(function(c){ return Object.assign({paragraphIndex:pi},c); }));
    if(!(ch.comments[String(pi)]||[]).length) npApplyComments(ch,npLocalComments(ch,2).map(function(c){ c.paragraphIndex=pi; return c; }));

function bookById(id){ return (DB.books||[]).find(function(x){ return x.id===id; })||null; }
function readingById(id){ return (DB.readings||[]).find(function(x){ return x.id===id; })||null; }
function bookParas(book){
  return (book&&book.chapters||[]).reduce(function(a,c){ return a.concat(npParas(c)); },[]);
}
function npNormalizeReading(r,b){
  if(!r||!b) return r;
  r.startChapter=Math.max(0,Math.min(Number(r.startChapter)||0,(b.chapters||[]).length-1));
  r.endChapter=Math.max(r.startChapter,Math.min(Number(r.endChapter)||r.startChapter,(b.chapters||[]).length-1));
  r.chapterIndex=Math.max(r.startChapter,Math.min(Number(r.chapterIndex)||r.startChapter,r.endChapter));
  r.paraIndex=Math.max(0,Number(r.paraIndex)||0);
  if(r.chat===undefined) r.chat=[];
  if(r.index!==undefined&&!r.chat.length){ r.chapterIndex=0; r.paraIndex=Number(r.index)||0; delete r.index; }
  return r;
}

function readingStep(rid,delta){
  const r=readingById(rid), b=r? bookById(r.bookId):null; if(!r||!b) return;
  npNormalizeReading(r,b);
  const ch=(b.chapters||[])[r.chapterIndex], ps=npParas(ch);
  let ni=Number(r.paraIndex||0)+delta;
  if(ni<0){
    if(r.chapterIndex>r.startChapter){ r.chapterIndex--; r.paraIndex=Math.max(0,npParas((b.chapters||[])[r.chapterIndex]).length-1); }
    else r.paraIndex=0;
  }else if(ni>=ps.length){
    if(r.chapterIndex<r.endChapter){ r.chapterIndex++; r.paraIndex=0; }
    else r.paraIndex=Math.max(0,ps.length-1);
  }else r.paraIndex=ni;
  r.updatedAt=Date.now(); save(); render();
}

async function readingAskTa(rid){
  const r=readingById(rid), b=r? bookById(r.bookId):null, c=r? ct(r.cid):null;
  if(!r||!b||!c) return;
  npNormalizeReading(r,b);
  const ch=(b.chapters||[])[r.chapterIndex], ps=npParas(ch), para=ps[r.paraIndex]||'';
  r.chat=r.chat||[];
  if(!DB.api.key){
    const replies=['这一句我先停一下。','他这里明显没说实话。','你看他刚才那个停顿，像是在等对方追问。','如果是我，我会把这句话记很久。','这一段的光线和声音都很清楚。'];
    r.chat.push({role:'ta',text:pick(replies),ts:Date.now()}); r.updatedAt=Date.now(); save(); render(); return;
  }
  busy('正在想这一段，请稍后');
  try{
    const prev=(b.chapters||[]).slice(0,Math.min(r.chapterIndex+1,6)).map(function(x,i){ return '第'+(i+1)+'章 '+x.title+'：'+String(x.summary||'').slice(0,90); }).join('\n');
    const history=r.chat.slice(-8).map(function(m){ return {role:m.role==='me'?'user':'assistant',content:String(m.text||'').slice(0,180)}; });
    const sys=promptOf(c,null,[],{format:'narrative'})
      +'\n【任务】你和对方正在一起读《'+b.title+'》。你知道前面的剧情摘要，不要假装第一次看到。'
      +'\n【当前】'+ch.title+'\n当前段：'+para
      +'\n【前情摘要】\n'+prev
      +'\n【格式】只输出 1 到 2 句自然对白，不要旁白标题，不要替对方说话。'
      +'\n【重点】回应当前段的具体细节；可以提问、吐槽、联想；不要总结全文。';
    const out=await callModel([{role:'system',content:sys}].concat(history));
    r.chat.push({role:'ta',text:String(out||'').trim().slice(0,300),ts:Date.now()}); r.updatedAt=Date.now(); save();
    if(route.name==='read') render();
  }catch(e){ toast('出错：'+e.message); }finally{ busyDone(); }
}

const AUTO_GAP_MS=[Infinity,6*3600e3,3*3600e3,90*60e3,40*60e3,15*60e3];
function fqOfChat(ch){
  let f=2;
  ch.memberIds.forEach(id=>{ const c=ct(id); const v=(c&&c.autoFreq!==undefined)? Number(c.autoFreq) : 2; if(v>f) f=v; });
  return Math.max(0,Math.min(5,f));
}
async function autoTick(){
  if(!DB.api.key||!DB.auto) return;
  const now=Date.now();
  const cands=[];
  DB.chats.forEach(ch=>{
    if(!ch.memberIds.length) return;
    const allOff=ch.memberIds.every(function(id){ const c=ct(id); return c&&c.autoOn===false; });
    if(allOff) return;
    const gap=AUTO_GAP_MS[fqOfChat(ch)];
    if(!isFinite(gap)) return;
    if(now-(ch.lastAuto||0)<gap) return;
    if(now-(ch.lastTs||0)<60000) return;
    cands.push(ch);
  });
  if(!cands.length) return;
  cands.sort((a,b)=>(a.lastTs||0)-(b.lastTs||0));
  const target=cands[0];
  target.lastAuto=now;
  if(Math.random()<0.22){
    const cc=ct(target.memberIds[0]);
    if(cc){
      pushMsg(target.id,{role:'sys',type:'text',text:cc.name+'拍了拍你的'+(cc.nudgeMe||'小脑袋'),ts:Date.now()});
      save();
      const prev=curChatId; curChatId=target.id;
      try{ await aiTurn({speaker:cc,nudge:'你刚拍了拍对方。现在发聊天消息，只发气泡，不要旁白、动作或括号，按设置的句数回复。'}); }catch(e){}
      curChatId=prev; save();
      if(route.name==='wechat') render();
      return;
    }
  }
  const prev=curChatId; curChatId=target.id;
  try{
    await aiTurn({nudge:'你自己主动找对方说话。注意：对方还没有回你，所以绝对不要自问自答，也不要说「好的」「可以」「那就这样」这种像是在回应自己的话。换一个新的点：说说你正在做的事、你刚想到的事，或者想对方了。只说一到两句。'});
  }catch(e){}
  curChatId=prev;
  save();
  if(route.name==='wechat') render();
}

function parseShopItems(text){
  const out=[];
  const add=function(name,price){
    name=String(name||'').trim(); price=Number(price)||0;
    if(!name||!price) return;
    if(out.some(function(x){ return x.name===name; })) return;
    out.push({id:uid(),name:name.slice(0,24),price:price,desc:''});
  };
  parseItems(text).forEach(function(x){ add(x.name,x.price); });
  String(text||'').split(/\r?\n/).forEach(function(line){
    const t=line.replace(/^[\s\-*·>#]+/,'').replace(/^\d+[.、)]\s*/,'').trim();
    if(!t) return;
    const m=t.match(/^(.{1,30}?)[\s|｜:：—–-]+[¥￥]?\s*(\d+(?:\.\d+)?)\s*元?$/);
    if(m) add(m[1],Number(m[2]));
  });
  return out.slice(0,10);
}

    const c=ct(d.cid);

      +'\n【任务】写一段在「'+shop+'」（'+tierName(tier)+'）里逛的场景。'+(mode==='solo'? '你一个人逛。' : ('你和'+c.name+'一起逛。'))
      +'\n2 到 4 段，写光线、声音、气味、货架上的东西、你（和 Ta）的手和视线。'
      +'\n然后另起一行写【货架】，再列 8 件这家店里的商品，每行一件，格式：商品名|价格数字';
    const out=await callModel([{role:'system',content:sys},{role:'user',content:'进去看看。'}]);

    const nt=await formatTurn(parts[0]||'', c? c.name:'');

      const retry=await callModel([{role:'system',content:'只输出 8 行商品，每行格式：商品名|价格数字。不要标题，不要解释，不要其他文字。'},{role:'user',content:'店名：'+shop}]);

async function meetTick(){
  if(!DB.api.key||!DB.auto) return;
  const now=Date.now();
  const list=(DB.contacts||[]).slice();
  for(const c of list){
    const f=Number(c.meetFreq)||0;
    if(!f||c.autoOn===false) continue;
    const gap=MEET_GAP[Math.min(5,f)];
    if(!isFinite(gap)) continue;
    if(now-(c.lastMeet||0)<gap) continue;
    const pending=(DB.dates||[]).some(function(d){ return d.cid===c.id&&d.arrive&&d.unread; });
    if(pending) continue;
    if(Math.random()>0.55) continue;
    const invite=Math.random()<0.5;
    const place=invite? pick(['夜市','河边','咖啡店门口','电影院','旧书摊']) : pick(['你家门口','你家楼下','你公司楼下']);
    try{
      const line=invite? await genInvite(c,place) : await genArrive(c,place);
      const d={id:uid(),cid:c.id,scene:'custom',sceneName:place,msgs:[
        {id:uid(),role:'ta',from:c.id,type:'text',text:line,ts:Date.now()}
      ],boundChatId:null,created:Date.now(),lastTs:Date.now(),arrive:!invite,invite:invite,unread:1};
      DB.dates=DB.dates||[];
      DB.dates.unshift(d);
      c.lastMeet=Date.now();
      save();
      if(route.name==='date'||route.name==='dateroom'||route.name==='home'||route.name==='wechat') render();
      toast(invite? (c.name+' 约你今晚在'+place+'见面') : (c.name+' 来找你了：'+place));
    }catch(e){ logErr('突然来访生成失败（已跳过）：'+e.message); }
    break;
  }
}

      wbNotify('comment','《'+wbNoticeExcerpt(post)+'》有 '+made.length+' 条新评论',post.id);

    }
  });

}
async function wbGenHotTopicPosts(trends){
  const cs=wbCast();
  const world=wbWorldBlock(cs);
  const myName=wbMeName();
  const passer=WB_NAMES.slice(0,18).join('、');
  const list=(trends||[]).map(function(t,i){ return (i+1)+'. #'+t.title+'# · '+t.heat; }).join('\n');
  const sys='你在为微博热搜前三条生成帖子。每个话题 2 条，共 6 条。\n'
    +wbCastBlock(cs)+'\n'
    +(world? world+'\n':'')
    +'【用户只作为被讨论对象】禁止用户本人（'+myName+'）发帖。\n'
    +'帖子必须符合发帖角色的人设、性格、说话习惯、身份和世界；不同角色不能都像营销号。\n'
    +'路人网名只能从以下固定网名里选：'+passer+'。不要用类型名。\n'
    +'话题必须严格使用给出的三个话题之一。\n'
    +'输出 JSON，不要解释，不要代码块：{"posts":[{"topic":"话题名","who":"人物名字","text":"40 到 100 字"}]}';
  const out=await callModel([{role:'system',content:sys},{role:'user',content:list}]);
  const j=wbJSON(out);
  const arr=(Array.isArray(j.posts)?j.posts:[]).slice(0,6);
  const used=new Set(cs.map(function(c){ return c.name; }));
  const posts=[];
  arr.forEach(function(x,i){
    let nm=String(x.who||'').trim();
    let hit=cs.find(function(c){ return c.name===nm; });
    if(!hit && wbIsUserName(nm)) hit=cs.length? pick(cs):null;
    let key;
    if(hit) key=hit.id;
    else { const pn=(WB_NAMES.indexOf(nm)>=0&&!used.has(nm))? nm: wbPickName(used); used.add(pn); key='s:'+pn; }
    const a=wbAuthor(key);
    const topic=(trends||[]).find(function(t){ return t.title===String(x.topic||''); })||(trends||[])[i%(trends||[]).length]||{};
    posts.push({id:uid(),author:a,text:wbClean(x.text),topic:topic.title||'',cat:'热门',local:false,ts:Date.now()-i*60000,
      likes:Math.floor(Math.random()*2000),reposts:Math.floor(Math.random()*200),liked:false,comments:[],repostOf:null,img:0,source:a.source});
  });
  return posts;
}

async function wbRefresh(){
  if(!needKey()) return;
  const w=wbDB();
  if(w.tab==='discover'){
    busy('正在刷新热搜和帖子，请稍后');
    try{
      w.trends=await wbGenTrends();
      w.hotSeen=0;
      let hot=[];
      try{ hot=await wbGenHotTopicPosts(w.trends.slice(0,3)); }catch(e){ logErr('热搜帖子生成失败：'+e.message); }
      if(hot.length){
        w.posts=(hot||[]).concat(w.posts).slice(0,200);
        w.newCount=hot.length; w.newAt=Date.now();
        wbNotifyMentions(hot);
        try{ await wbGenBatchComments(hot); }catch(e){ logErr('热搜评论生成失败：'+e.message); }
      }
      save(); render(); wbScheduleNewCountClear(); toast(hot.length? '热搜和帖子已更新':'热搜已更新');
    }catch(e){ toast('出错：'+e.message); }finally{ busyDone(); }
    return;
  }
  const mode=w.sub||'rec';
  if(mode==='follow' && !wbCast().length){ toast('还没有可选角色'); return; }
  busy('正在刷新微博，请稍后');
  try{
    if(!w.following.length) w.following=wbCast().map(function(c){ return c.id; });
    const posts=await wbGenFeed(mode);
    if(!posts.length){ toast('这次没刷出内容'); return; }
    w.posts=(posts||[]).concat(w.posts).slice(0,200);
    w.newCount=posts.length; w.newAt=Date.now();
    wbNotifyMentions(posts);
    const mine=w.posts.filter(function(p){ return p.author.key==='me'; });
    const cs=wbCast();
    if(mine.length && cs.length){
      const p=mine[Math.floor(Math.random()*mine.length)];
      const c=cs[Math.floor(Math.random()*cs.length)];
      wbNotify('like',c.name+' 赞了你的微博',p.id);
      w.me.fans=(Number(w.me.fans)||0)+Math.floor(Math.random()*3);

function parseSections(text){
  const out=[]; let cur=null;
  String(text||'').split(/\r?\n/).forEach(line=>{
    const m=line.match(/^\s*[【\[]([^】\]]{1,14})[】\]]\s*(.*)$/);
    if(m){ cur={t:m[1].trim(),lines:[]}; out.push(cur); if(m[2].trim()) cur.lines.push(m[2].trim()); }
    else if(line.trim()){ if(!cur){ cur={t:'其他',lines:[]}; out.push(cur); } cur.lines.push(line.trim().replace(/^[-*·]\s*/,'')); }
  });
  return out;
}
function parseItems(text){
  const items=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    let t=line.trim().replace(/^[-*·\s]+/,'').replace(/^\d+[.、)]\s*/,'');
    if(!t) return;
    const p=t.split(/[|｜]/).map(x=>x.trim());
    if(p.length<2||!p[0]) return;
    const price=Number(String(p[1]).replace(/[^\d.]/g,''))||0;
    if(price<=0) return;
    const opts=String(p[3]||'').split(/[\/、,，]/).map(function(x){ return x.trim(); }).filter(Boolean).slice(0,8);
    items.push({id:uid(),name:p[0].slice(0,20),price:price,desc:(p[2]||'').slice(0,40),opts:opts,cat:(p[4]||'其他').slice(0,12)});
  });
  return items;
}

function streakOf(){
  const days=(DB.checkins||[]).map(x=>x.day);
  if(!days.length) return 0;
  let n=0; const d=new Date();
  for(;;){
    const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(days.indexOf(s)>=0){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}

  const out=await callModel([{role:'system',content:sys},{role:'user',content:'今天也打卡了。'}]);

}
function daysSince(dateStr){
  const t=new Date(String(dateStr||'')+'T00:00:00').getTime();
  if(isNaN(t)) return 1;
  const n=new Date(); const today=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  return Math.max(1,Math.floor((today-t)/86400000)+1);
}
function dayKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function streakOfCid(cid){
  const days=(DB.checkins||[]).filter(function(x){ return x.cid===cid; }).map(function(x){ return x.day; });
  if(!days.length) return 0;
  const d=new Date();
  if(days.indexOf(dayKey(d))<0) d.setDate(d.getDate()-1);
  let n=0;
  for(;;){ const k=dayKey(d); if(days.indexOf(k)>=0){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

  const d=(DB.tbItems||{})[c.id]; if(!d||!d.items[i]) return;
  const it=d.items[i], spec=tbSpecOf(i);
  if(buyItem({src:'网购',name:it.name+(spec? (' · '+spec):''),price:it.price,desc:it.desc,cid:c.id})){ toast('下单了 '+it.name); render(); }
}
async function genTaPick(c,items){
  const list=items.map((x,i)=>(i+1)+'. '+x.name+' '+x.price+'元').join('\n');
  const sys=promptOf(c,null,[])
    +'\n【这次的任务】你正在和对方一起逛网店。挑 2 到 3 件你想要的，再回一句。'
    +'\n格式：每行一件，写成「商品名|一句你想要的理由」；最后单独一行写你想说的话。商品名要和列表里一样。';
  const out=await callModel([{role:'system',content:sys},{role:'user',content:list}]);
  const picks=[], words=[];
  String(out||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
    if(/[|｜]/.test(line)){ const p=line.split(/[|｜]/); picks.push({name:p[0].replace(/^\d+[.、)]?\s*/,'').trim(),why:(p[1]||'').trim()}); }
    else words.push(line);
  });
  return {picks:picks.slice(0,3),say:words.join(' ')};
}
function sheetTaPick(c,d,pk){
  const items=(pk.picks||[]).map(function(p){
    const it=(d.items||[]).find(function(x){ return x.name===p.name; });
    return it? Object.assign({},it,{why:p.why}) : null;
  }).filter(Boolean);
  const total=items.reduce(function(s,x){ return s+Number(x.price||0); },0);
  sheet('<h3>'+esc(c.name)+' 挑的</h3>'
    +'<div class="muted" style="margin:6px 0 10px;line-height:1.7">'+esc(pk.say||'')+'</div>'
    +(items.length? items.map(function(x){
        return '<div class="kv"><span>'+esc(x.name)+'<div class="muted" style="font-size:12px;margin-top:2px">'+esc(x.why||'')+'</div></span><b>'+money(x.price)+'</b></div>';
      }).join('') : '<div class="muted">Ta 这次没挑到合适的。</div>')
    +'<div class="kv"><span>合计</span><b>'+money(total)+'</b></div>'
    +'<button class="btn primary full" id="tpMe">我付钱</button>'
    +'<button class="btn full" id="tpTa">让 '+esc(c.name)+' 付</button>'
    +'<button class="btn full" id="tpNo">算了</button>');
  const finish=function(payer){
    if(!items.length){ closeSheet(); return; }
    let ok=0;
    items.forEach(function(it){
      if(payer==='me'){
        if(buyItem({src:'网购',name:it.name,price:it.price,desc:it.desc,cid:c.id,words:it.why||''})) ok++;
      }else{
        DB.orders=DB.orders||[];
        DB.orders.unshift({id:uid(),src:'网购',name:it.name,price:it.price,desc:it.desc||'',ts:Date.now(),cid:c.id,words:(it.why||'')+'（Ta 付的钱）',payer:'ta'});
        ok++;
      }
    });
    save(); closeSheet();
    toast(payer==='me'? (ok? ('你付了 '+ok+' 件'):'余额不够') : ('Ta 付了 '+ok+' 件'));
    render();
  };
  $('#tpMe').onclick=function(){ finish('me'); };
  $('#tpTa').onclick=function(){ finish('ta'); };
  $('#tpNo').onclick=closeSheet;
}
const TB_PRICES=[['all','全部价位'],['low','0-50'],['mid','50-300'],['high','300-2000'],['lux','2000+']];
function tbPriceLabel(k){ const x=TB_PRICES.find(function(v){ return v[0]===k; }); return x?x[1]:'全部价位'; }
function tbPriceMatch(price,k){
  price=Number(price)||0;
  if(k==='low') return price<50;
  if(k==='mid') return price>=50&&price<300;
  if(k==='high') return price>=300&&price<2000;
  if(k==='lux') return price>=2000;
  return true;
}
function sheetTbPersona(){
  const ps=DB.me.personas||[];
  const cur=DB.tbPersona||'';
  const draw=function(){
    sheet('<h3>网购用户人设</h3><div class="muted" style="margin:6px 0 10px;line-height:1.7">刷新商品时会同时参考角色和这个人设。</div>'
      +'<div class="lrow" data-tbper=""><div class="mi"><div class="t1">跟随当前启用的人设</div><div class="t2">'+esc((DB.me.personas||[]).find(function(x){ return x.id===DB.me.personaId; })?.name||'当前没有启用的人设')+'</div></div><div class="rt">'+(!cur?'<span class="wbcheck">✓</span>':'')+'</div></div>'
      +(ps.length? ps.map(function(x){ return '<div class="lrow" data-tbper="'+x.id+'"><div class="mi"><div class="t1">'+esc(x.name)+'</div><div class="t2 ell">'+esc(personaFullText(x).replace(/\n/g,' ').slice(0,42))+'</div></div><div class="rt">'+(cur===x.id?'<span class="wbcheck">✓</span>':'')+'</div></div>'; }).join('') : '<div class="muted" style="padding:8px 0 14px">还没建人设，先去用户人设库建一个。</div>')
      +'<button class="btn primary full" id="tbperOk">完成</button>');
    $$('#sheetBox [data-tbper]').forEach(function(el){ el.onclick=function(){ DB.tbPersona=el.dataset.tbper||null; save(); draw(); }; });
    $('#tbperOk').onclick=function(){ closeSheet(); render(); };
  };
  draw();
}
function screenTaobao(){
  const name='网购';
  const c=ct(DB.tbCid)||ct((DB.contacts[0]||{}).id);
  if(c) DB.tbCid=c.id;
  if(!c) return emptyBar('网购');
  const tab=DB.tbTab||'feed';
  const data=(DB.tbItems||{})[c.id];
  const items=(data&&data.items)||[];
  const w=meWallet();
  const mine=DB.cartMe||[], ta=(DB.cartTa||{})[c.id]||[];
  const per=(DB.me.personas||[]).find(function(x){ return x.id===(DB.tbPersona||DB.me.personaId); });
  const tabsHtml='<div class="tabs"><div class="tab'+(tab==='feed'?' on':'')+'" data-tbtab="feed">逛逛</div>'
    +'<div class="tab'+(tab==='mine'?' on':'')+'" data-tbtab="mine">我的购物车'+(mine.length? ' ('+mine.length+')':'')+'</div>'
    +'<div class="tab'+(tab==='ta'?' on':'')+'" data-tbtab="ta">和 Ta 的购物车'+(ta.length? ' ('+ta.length+')':'')+'</div>'
    +'<div class="tab'+(tab==='orders'?' on':'')+'" data-tbtab="orders">订单'+(DB.orders&&DB.orders.length? ' ('+DB.orders.length+')':'')+'</div></div>';
  let body='';
  if(tab==='feed'){
    const cats=['all'].concat(Array.from(new Set(items.map(function(x){ return x.cat||'其他'; }))));
    const price=DB.tbPrice||'all', cat=DB.tbCat||'all';
    const filtered=items.filter(function(x){ return tbPriceMatch(x.price,price)&&(cat==='all'||(x.cat||'其他')===cat); });
    const groups={};
    filtered.forEach(function(x){ const k=x.cat||'其他'; (groups[k]=groups[k]||[]).push(x); });
    const itemHTML=Object.keys(groups).map(function(k){
      return '<div class="sechead">'+esc(k)+' · '+esc(tbPriceLabel(price))+'</div>'
        +groups[k].map(function(x){
          const i=items.indexOf(x);
          return '<div class="card"><div class="row"><div class="grow"><div><b>'+esc(x.name)+'</b></div>'
            +'<div class="muted" style="margin-top:4px">'+esc(x.desc||'')+'</div></div><div class="rt"><div><b>'+money(x.price)+'</b></div></div></div>'
            +((x.opts&&x.opts.length)? '<select data-spec="'+i+'" style="margin-top:10px">'+x.opts.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join('')+'</select>' : '')
            +'<div class="row" style="margin-top:10px"><button class="btn grow" data-addme="'+i+'" data-run="addMe:'+i+'">加我的</button>'
            +'<button class="btn grow" data-addta="'+i+'" data-run="addTa:'+i+'">加 Ta 的</button><button class="btn primary" data-tbbuy="'+i+'" data-run="tbBuy:'+i+'">直接买</button></div></div>';
        }).join('');
    }).join('');
    body='<div class="card"><div class="row"><div class="grow"><b>'+esc(name)+'</b><div class="muted">绑定中：'+esc(c.name)+' · 用户人设：'+esc(per?per.name:'未绑定')+'</div></div>'
      +'<button class="btn primary" data-run="tbGo" id="tbGo">'+(items.length? '刷新':'刷一刷')+'</button></div></div>'
      +(per? '' : '<div class="card"><div class="muted">刷新商品前要先绑定用户人设。</div><button class="btn full" data-tbpersona="1">选择用户人设</button></div>')
      +'<div class="tabs" style="overflow-x:auto">'+TB_PRICES.map(function(x){ return '<div class="tab'+(price===x[0]?' on':'')+'" data-tbprice="'+x[0]+'">'+x[1]+'</div>'; }).join('')+'</div>'
      +'<div class="tabs" style="overflow-x:auto"><div class="tab'+(cat==='all'?' on':'')+'" data-tbcat="all">全部品类</div>'
      +cats.slice(1).map(function(x){ return '<div class="tab'+(cat===x?' on':'')+'" data-tbcat="'+esc(x)+'">'+esc(x)+'</div>'; }).join('')+'</div>'
      +(items.length? (filtered.length? itemHTML : '<div class="card"><div class="muted">这个价位和品类下还没有商品，换一个筛选看看。</div></div>') : '<div class="card"><div class="muted">还没有商品，点上面的「刷一刷」。</div></div>')
      +(items.length? '<button class="btn full" data-run="taPick" id="taPick">让 '+esc(c.name)+' 挑几件</button>':'')
      +(data&&data.pick? '<div class="card"><b>'+esc(c.name)+' 挑的这几件</b><div class="muted" style="margin-top:8px;line-height:1.8">'
        +(data.pick.picks||[]).map(function(p){ return esc(p.name)+'　'+esc(p.why); }).join('<br>')+(data.pick.say? '<br><br>'+esc(data.pick.say):'')+'</div>'
        +'<button class="btn full" id="taPickBuy">这几件一起买</button></div>':'');
  }else if(tab==='mine'){
    body=cartHTML(mine, 'me', '我的购物车');
  }else if(tab==='ta'){
    body=cartHTML(ta, 'ta', '和 '+c.name+' 的购物车');
  }else{
    const os=DB.orders||[];
    body=os.length? os.map(function(o){ return '<div class="card" data-order="'+o.id+'"><div class="row"><div class="grow"><div><b>'+esc(o.name)+'</b></div>'
      +'<div class="muted" style="margin-top:4px">'+esc(o.src||'')+(o.tier? ' · '+esc(tierName(o.tier)):'')+' · '+shortTime(o.ts)+' · '+(o.sold?'已转卖':'已收货')+'</div></div>'
      +'<div class="rt"><b>'+money(o.price)+'</b><button class="btn danger" data-orderdel="'+o.id+'" style="margin-top:6px">删</button></div></div>'
      +(o.words? '<div class="muted" style="margin-top:8px">'+esc(o.words)+'</div>':'')+'</div>'; }).join('')
      : '<div class="card"><div class="muted">还没有订单。</div></div>';
  }
  return '<div class="pad" style="padding-top:0">'
    +wxTop(name,clearBtn('shop')+'<span class="muted" style="font-size:13px">余额 '+money(w.balance)+'</span>')
    +tabsHtml
    +'<div class="lrow" data-picktb="1">'+avBox(c)+'<div class="mi"><div class="t1">'+esc(c.name)+'</div><div class="t2">绑定中，点一下换人</div></div><div class="rt"><span class="chev">›</span></div></div>'
    +'<div class="lrow" data-tbpersona="1"><div class="av" style="background:#8e8e93">人</div><div class="mi"><div class="t1">用户人设</div><div class="t2">'+esc(per?per.name:'未绑定，点这里选择')+'</div></div><div class="rt"><span class="chev">›</span></div></div>'
    +body+'</div>';
}
function cartHTML(list,who,title){
  if(!list.length) return '<div class="card"><b>'+esc(title)+'</b><div class="muted" style="margin-top:8px">还空着。</div></div>';
  const total=list.reduce((s,x)=>s+Number(x.price||0),0);
  return '<div class="card"><b>'+esc(title)+'</b><div class="muted" style="margin-top:6px">共 '+list.length+' 件 · 合计 '+money(total)+'</div>'
    +'<button class="btn primary full" id="cartBuyAll" data-cartwho="'+who+'">全部结算</button></div>'
    +list.map((x,i)=>'<div class="card"><div class="row"><div class="grow"><div><b>'+esc(x.name)+'</b></div>'
      +(x.why? '<div class="muted" style="margin-top:4px">'+esc(x.why)+'</div>':'')+'</div>'
      +'<div class="rt"><b>'+money(x.price)+'</b><button class="btn danger" data-cartdel="'+who+':'+i+'" style="margin-top:6px">删</button></div></div></div>').join('');
}
