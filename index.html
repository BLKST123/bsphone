<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BS小手机">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BS小手机</title>
<style>
:root{
  --fg:#111; --fg2:#6b6b70; --card:rgba(255,255,255,.86); --line:rgba(0,0,0,.08);
  --accent:#0a84ff; --danger:#ff3b30; --radius:20px;
  --bub-me:#95ec69; --bub-me-fg:#111; --bub-ta:#fff; --bub-ta-fg:#111;
  --wall:linear-gradient(160deg,#dbe7ff 0%,#eef2ff 45%,#ffe9f0 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font:16px/1.5 -apple-system,"SF Pro Text","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--wall)}
#phone{font-family:var(--ui-font,-apple-system,"SF Pro Text","Microsoft YaHei",sans-serif)}
#phone.low-perf *,#phone.low-perf *::before,#phone.low-perf *::after{animation:none!important;transition:none!important;box-shadow:none!important}
#phone.low-perf .dock,#phone.low-perf .composer,#phone.low-perf .sheet .box{backdrop-filter:none!important}
#phone{position:relative;height:100dvh;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--wall);overflow:hidden}
#pageBg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;pointer-events:none;transition:opacity .2s}
#pageBg.on{opacity:1}
.stat,.screen{position:relative;z-index:1}
.stat{z-index:300}
.sheet-back{position:absolute;left:8px;top:calc(env(safe-area-inset-top) + 6px);z-index:60;display:none;align-items:center;justify-content:center;width:34px;height:34px;border:0;border-radius:50%;background:rgba(18,20,24,.58);color:#fff;font-size:25px;line-height:1;cursor:pointer;backdrop-filter:blur(8px)}
.sheet.fullsheet.on .sheet-back{display:flex}
.screen.has-page-wall .np-shell,
.screen.has-page-wall .np-body,
.screen.has-page-wall .np-me-page,
.screen.has-page-wall .np-me-bottom,
.screen.has-page-wall .wx,
.screen.has-page-wall .wxbody,
.screen.has-page-wall .chatwrap{background:transparent}
.screen.has-page-wall .np-me-bottom{background:rgba(247,244,236,.88)}
#phone.dark{--fg:#fff;--fg2:#a8a8ae;--card:rgba(28,28,30,.82);--line:rgba(255,255,255,.12);--wall:linear-gradient(160deg,#0b1020 0%,#141a2e 45%,#2a1b2a 100%);
  --bub-me:#39572c; --bub-me-fg:#eaf7e1; --bub-ta:#2c2c2e; --bub-ta-fg:#f2f2f7}
/* 状态栏 */
.stat{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 2px) 14px 2px;font-size:13px;font-weight:600;color:var(--fg);flex:none;cursor:pointer;user-select:none;position:relative;z-index:300}
.stat.sheet-open{background:var(--wall);color:var(--fg);text-shadow:none}
.stat.sheet-open .gback{color:var(--fg)}
.stat .st-left{display:flex;align-items:center;gap:4px;min-width:64px}
.stat .gback{display:none;background:none;border:0;color:var(--fg);font-size:20px;line-height:1;padding:0 5px 0 0;cursor:pointer}
.stat.has-back .gback{display:block}
.stat .r{display:flex;gap:6px;align-items:center;font-weight:500;opacity:.9}
/* 屏幕区 */
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen.lock{overflow:hidden}
.pad{padding:4px 20px 24px}
/* 桌面 */
.clock{text-align:center;padding:26px 0 6px}
.clock .t{font-size:64px;font-weight:200;letter-spacing:-2px;line-height:1}
.clock .d{color:var(--fg2);font-size:14px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 14px;padding:22px 18px 10px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.app .ic{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.14);background:#0a84ff;position:relative}
.app .nm{font-size:12px;color:var(--fg);text-shadow:0 1px 2px rgba(255,255,255,.35)}
.dock{margin:10px 14px calc(env(safe-area-inset-bottom) + 12px);padding:10px;border-radius:22px;background:var(--card);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dock .app .ic{width:52px;height:52px;border-radius:14px;font-size:24px}
.home-dots{display:flex;justify-content:center;gap:6px;margin:2px 0 6px}
.home-dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.18);cursor:pointer}
.home-dot.on{background:rgba(0,0,0,.55);width:14px;border-radius:3px}
#phone.dark .home-dot{background:rgba(255,255,255,.25)}
#phone.dark .home-dot.on{background:rgba(255,255,255,.82)}
.home-widgets{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:42px;gap:8px;padding:4px 18px 8px}
.home-widget{min-width:0;min-height:0;width:100%;height:100%;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12);background:rgba(255,255,255,.72);backdrop-filter:blur(12px)}
.hw-image{position:relative;height:100%}
.hw-image img{width:100%;height:100%;object-fit:cover;display:block}
.hw-cap{position:absolute;left:0;right:0;bottom:0;padding:8px 9px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:10.5px}
.hw-text{padding:10px;height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;background:rgba(255,252,246,.78)}
.hw-title{font-size:13px;font-weight:650;line-height:1.35}
.hw-body{font-size:11.5px;line-height:1.65;color:var(--fg2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.widget-preview{min-height:110px;border:1px dashed var(--line);border-radius:14px;overflow:hidden;margin:10px 0;background:rgba(0,0,0,.02)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* 页面头 */
.nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .back{font-size:15px;color:var(--accent);background:none;border:0;padding:6px 4px;cursor:pointer;min-width:56px;text-align:left}
.nav .ttl{font-weight:600;font-size:16px;flex:1;text-align:center}
.nav .act{min-width:56px;text-align:right;padding:0;margin:0;background:none;border-radius:0}
.nav button.link{background:none;border:0;color:var(--accent);font-size:15px;cursor:pointer}
/* 通用 */
.card{background:var(--card);backdrop-filter:blur(14px);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.muted{color:var(--fg2);font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.row+.row{margin-top:12px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.btn{font:inherit;font-size:15px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--fg);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.danger{color:var(--danger)}
button.btn.full{width:100%;margin-top:10px}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--fg)}
textarea{min-height:90px;resize:vertical;line-height:1.55}
.frm{display:flex;flex-direction:column;gap:10px}
.avatar{width:52px;height:52px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--fg2);font-size:14px;padding:40px 20px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1}
.sheet{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheet .box{background:#fff;color:#111;width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:82dvh;overflow-y:auto}
.sheet .box h3{margin:0 0 12px;font-size:16.5px}
.wp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wp div{height:80px;border-radius:16px;border:2px solid transparent;cursor:pointer}
.wp div.on{border-color:var(--accent)}
@media (min-width:521px){#phone{box-shadow:0 0 60px rgba(0,0,0,.35)}}
/* ======== 微信壳 ======== */
.wx{display:flex;flex-direction:column;height:100%;min-height:0}
.wxbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wxtab{display:grid;grid-template-columns:repeat(4,1fr);flex:none;background:rgba(250,250,252,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.lrow:active{background:rgba(0,0,0,.04)}
.lrow .av{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex:none}
.lrow .av img{width:100%;height:100%;object-fit:cover}
.row>.av{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;font-size:17px}
.row>.av img{width:100%;height:100%;object-fit:cover;display:block}
.lrow .mi{flex:1;min-width:0}
.lrow .t1{font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .t2{font-size:13px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.lrow .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lrow .tm{font-size:11.5px;color:var(--fg2)}
.lrow .ub{min-width:18px;height:18px;border-radius:9px;background:#ff3b30;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.sechead{padding:12px 16px 6px;font-size:12.5px;color:var(--fg2)}
.wxtop{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;position:sticky;top:0;background:var(--card);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:4}
.wxtop .h{font-size:19px;font-weight:700;flex:1}
.wxtop .ic2{font-size:19px;color:var(--fg);cursor:pointer;background:none;border:0;padding:2px 4px}
/* ======== 聊天 ======== */
.chatwrap{display:flex;flex-direction:column;height:100%;min-height:0}
.chatlist{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 4px;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;gap:8px;align-items:flex-start}
.mrow.me{flex-direction:row-reverse}
.msgav{width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--accent);color:#fff;overflow:hidden}
.msgav img{width:100%;height:100%;object-fit:cover}
.colw{display:flex;flex-direction:column;gap:3px;max-width:76%;min-width:0}
.mrow.me .colw{align-items:flex-end}
.who{font-size:11px;color:var(--fg2);padding:0 3px}
.bub{padding:9px 12px;border-radius:16px;font-size:15.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap;background:var(--bub-ta);color:var(--bub-ta-fg);border:1px solid var(--line)}
.mrow.me .bub{background:var(--bub-me);color:var(--bub-me-fg);border-color:transparent}
.act{display:block;margin:6px 0;padding:7px 9px;border-radius:9px;background:rgba(0,0,0,.055);font:13px/1.6 ui-monospace,Consolas,monospace;color:var(--fg2)}
#phone.dark .act{background:rgba(255,255,255,.08)}
.bub .t{white-space:pre-wrap}
.chatty{align-self:flex-start;color:var(--fg2);font-size:12.5px;padding:0 8px}
.sysline{align-self:center;font-size:11.5px;color:var(--fg2);background:rgba(0,0,0,.05);padding:3px 10px;border-radius:8px}
.rich{width:232px;border-radius:12px;overflow:hidden;background:#fff;color:#111;border:1px solid rgba(0,0,0,.07)}
.rp{background:linear-gradient(145deg,#f7a928,#e8811a);color:#fff;padding:13px;display:flex;gap:10px;align-items:center}
.rp .ic3{font-size:26px}
.rp .tt{font-size:13px;opacity:.95}
.rp .am{font-size:14.5px;font-weight:600;margin-top:2px}
.rich .ft{font-size:11.5px;color:#8a8a8e;padding:6px 10px;border-top:1px solid rgba(0,0,0,.06)}
.rich img{width:100%;max-height:230px;object-fit:cover;display:block}
.vbub{display:flex;align-items:center;gap:8px;cursor:pointer}
.vbub .wv{display:flex;align-items:center;gap:2px;height:14px}
.vbub .wv i{display:block;width:3px;background:currentColor;border-radius:2px;opacity:.55}
.vbub.playing .wv i{animation:vwave .55s ease-in-out infinite alternate}
.vbub.playing .wv i:nth-child(2){animation-delay:.12s}.vbub.playing .wv i:nth-child(3){animation-delay:.24s}.vbub.playing .wv i:nth-child(4){animation-delay:.36s}.vbub.playing .wv i:nth-child(5){animation-delay:.48s}
@keyframes vwave{from{transform:scaleY(.55);opacity:.45}to{transform:scaleY(1.35);opacity:1}}
.voice-wrap{display:flex;align-items:center;gap:6px;max-width:100%}
.voice-wrap .vbub{flex:none}
.vtt{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--fg2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.vtrans{margin-top:5px;font-size:12.5px;line-height:1.65;padding:7px 9px;border-radius:10px;background:rgba(0,0,0,.05);color:var(--fg2)}
#phone.dark .vtrans{background:rgba(255,255,255,.07)}
.sticker{width:110px;border-radius:12px;display:block}
.moment-line{font-size:12px;color:var(--fg2);text-align:center}
/* ======== 输入栏 ======== */
.composer{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px;margin:0 10px 10px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px}
.composer input{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:0}
.composer input:focus{outline:none}
.cbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--fg);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.cbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.plus{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;padding:14px 6px 4px}
.plus .it{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--fg);cursor:pointer}
.plus .it .ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stkpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 4px 4px}
.stkpick img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;background:#f2f2f4}
/* ======== 朋友圈 ======== */
.mcover{height:158px;background:linear-gradient(135deg,#8ab4f8,#a6a1e8 55%,#c3a1d8);background-size:cover;background-position:center;background-repeat:no-repeat;position:relative;flex:none}
.mcover .chg{position:absolute;right:10px;bottom:10px;font-size:11.5px;background:rgba(0,0,0,.42);color:#fff;padding:4px 9px;border-radius:10px;cursor:pointer}
.mcover .mein{position:absolute;right:14px;bottom:-20px;display:flex;align-items:flex-end;gap:8px}
.mcover .mein .av{width:56px;height:56px;border-radius:12px;border:3px solid #fff;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.mcover .mein .av img{width:100%;height:100%;object-fit:cover}
.mcover .mein .nm{position:absolute;right:64px;bottom:26px;color:#fff;font-size:14.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.55);white-space:nowrap;padding:0}
.mpost{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mpost .av{width:42px;height:42px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex:none}
.mpost .av img{width:100%;height:100%;object-fit:cover}
.mpost .nm{font-size:14.5px;font-weight:600;color:#4a6fa5}
.mtext{font-size:15px;line-height:1.55;white-space:pre-wrap;margin-top:3px}
.mimgs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.mimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.mloc{font-size:12.5px;color:#4a6fa5;margin-top:7px}
.mtime{font-size:11.5px;color:var(--fg2);margin-top:7px}
.mbox{background:rgba(0,0,0,.045);border-radius:9px;padding:8px 10px;margin-top:8px}
.mlike{font-size:13px;color:#4a6fa5;line-height:1.5}
.mcmt{font-size:13.5px;line-height:1.5;margin-top:5px;color:var(--fg)}
.mcmt b{color:#4a6fa5;font-weight:600}
.mre{margin-left:12px;border-left:2px solid rgba(0,0,0,.08);padding-left:8px;margin-top:4px}
.mact{display:flex;gap:8px;margin-top:8px}
.mact .b{font-size:12px;color:#4a6fa5;background:rgba(74,111,165,.09);border:0;border-radius:8px;padding:4px 11px;cursor:pointer}
/* ======== 我的 ======== */
.mecard{display:flex;align-items:center;gap:14px;padding:20px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.mecard .av{width:58px;height:58px;border-radius:16px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-size:22px}
.mecard .av img{width:100%;height:100%;object-fit:cover;display:block}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.mgrid .mi{background:var(--card);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.mgrid .mi .t{font-size:14.5px;font-weight:600}
.mgrid .mi .d{font-size:12px;color:var(--fg2)}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.stk{margin-top:10px}
.stk .im{width:100%;aspect-ratio:1;border-radius:10px;background:#f2f2f4;object-fit:cover}
/* ======== 矮屏自适应 ======== */
@media (max-height:760px){
  .clock{padding:14px 0 2px}
  .clock .t{font-size:48px}
  .clock .d{font-size:13px;margin-top:4px}
  .grid{gap:12px 10px;padding:14px 16px 6px}
  .app .ic{width:52px;height:52px;border-radius:14px;font-size:24px}
  .app .nm{font-size:11.5px}
  .dock{margin:8px 12px calc(env(safe-area-inset-bottom) + 8px);padding:8px;border-radius:18px}
  .dock .app .ic{width:46px;height:46px;border-radius:13px;font-size:22px}
  .card{margin:10px 0;padding:14px}
  .lrow{padding:9px 14px}
  .lrow .av{width:42px;height:42px}
}
@media (max-height:640px){
  .clock{padding:6px 0 0}
  .clock .t{font-size:38px}
  .clock .d{font-size:12px}
  .grid{gap:10px 8px;padding:10px 14px 4px}
  .app .ic{width:46px;height:46px;border-radius:13px;font-size:22px}
  .app .nm{font-size:11px}
  .dock{padding:7px;border-radius:16px;margin:6px 10px calc(env(safe-area-inset-bottom) + 6px)}
  .dock .app .ic{width:42px;height:42px;border-radius:12px;font-size:20px}

.ap-tool b{display:block;font-size:12.5px;margin-top:5px}.ap-tool .mini{font-size:10px;margin-top:2px}
.ap-page-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:8px}
.ap-page{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.6)}
.ap-page .pic{height:62px;background-size:cover;background-position:center;background:linear-gradient(135deg,#dbe7ff,#ffe9f0)}
.ap-page .txt{padding:7px 9px;display:flex;align-items:center;gap:5px;font-size:11.5px}
.ap-live-frame{width:100%;aspect-ratio:390/844;position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:#eef2ff}
.ap-live-frame.compact{width:170px;margin:8px auto}
.ap-live-desktop{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:top left;pointer-events:none;overflow:hidden}
.widget-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.widget-card{border:1px solid var(--line);border-radius:14px;padding:8px;background:rgba(255,255,255,.6);min-width:0}
.widget-card .widget-preview{margin:0;min-height:92px}
.widget-card .wmeta{font-size:10px;color:var(--fg2);margin-top:6px}
.widget-card .wacts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.widget-card .wacts button{padding:3px 7px;font-size:10px}
.widget-pos-preview{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:38px;gap:5px;padding:8px;margin-top:8px;border:1px dashed var(--line);border-radius:12px;min-height:150px;background:rgba(0,0,0,.025)}
.wpos-item{min-width:0;min-height:0;overflow:hidden}
.app-icon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.app-icon-cell{border:1px solid var(--line);border-radius:14px;padding:9px;background:rgba(255,255,255,.62);text-align:center;min-width:0}
.app-icon-cell .big{width:48px;height:48px;border-radius:14px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.app-icon-cell .big img{width:100%;height:100%;object-fit:cover}
.app-icon-cell .nm{font-size:11.5px;font-weight:600}
.app-icon-cell .acts{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.app-icon-cell .acts button{padding:3px 6px;font-size:10px}
/* ===== 2026 淡樱粉 / 星舰灰主题 ===== */
:root{
  --fg:#6f6c73;--fg2:#9d9aa2;--accent:#c88fa3;--danger:#c47484;
  --card:rgba(255,250,251,.82);--line:rgba(157,154,162,.17);--radius:22px;
  --bub-me:#e8c4cf;--bub-me-fg:#5f5b61;--bub-ta:rgba(255,252,253,.92);--bub-ta-fg:#6f6c73;
  --wall:linear-gradient(160deg,#f8edf1 0%,#f3e3e9 55%,#efe9ec 100%);
  --theme-rose:#e8c4cf;--theme-rose-soft:#f7e9ed;--theme-rose-deep:#c88fa3;--theme-gray:#9d9aa2;
}
html,body{background:var(--wall);color:var(--fg)}
#phone{background:var(--wall)}
#phone{padding-top:0}
#phone::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.55;background-image:radial-gradient(rgba(255,255,255,.62) 1.5px,transparent 1.5px),radial-gradient(rgba(200,143,163,.16) 1px,transparent 1px);background-size:22px 22px,64px 64px;background-position:0 0,11px 11px}
.home-wrap{position:relative;isolation:isolate;height:100%;min-height:0;display:flex;flex-direction:column;touch-action:pan-y;overflow:hidden}
.home-wrap>*{position:relative;z-index:1}
.home-wrap>.dock{margin-top:0}
.home-mosaic{--desk-icon-size:48px;--desk-icon-radius:14px;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:64px;grid-auto-flow:row dense;gap:7px;padding:4px 14px 6px;margin-top:auto}
.home-mosaic .app{justify-content:center;min-height:0;gap:5px}
.home-mosaic .app .ic{width:var(--desk-icon-size);height:var(--desk-icon-size);border-radius:var(--desk-icon-radius);aspect-ratio:1}
.home-mosaic .app .nm{font-size:10px;line-height:1.2}
.home-mosaic .home-widget{min-height:0}
.home-app-group{display:grid;grid-template-columns:repeat(2,var(--desk-icon-size));justify-content:space-between;align-content:space-between;padding:2px 0;background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;overflow:visible!important}
.home-app-group.cols-4{grid-template-columns:repeat(4,var(--desk-icon-size));align-content:center}
.home-app-group .app{width:var(--desk-icon-size);justify-self:center;gap:4px}
.home-app-group .app .ic{width:var(--desk-icon-size)!important;height:var(--desk-icon-size)!important;border-radius:var(--desk-icon-radius)!important;aspect-ratio:1}
.home-app-group .app .nm{font-size:9.5px}
.home-mosaic .hw-text{padding:8px 9px}
.home-mosaic .hw-title{font-size:11px}
.home-mosaic .hw-body{font-size:9.5px;line-height:1.4;margin-top:2px}
.home-ambient{position:absolute;inset:-18px;z-index:6;overflow:hidden;pointer-events:none}
.home-petal{position:absolute;display:block;width:12px;height:18px;border-radius:70% 30% 70% 30%;background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(200,143,163,.2));box-shadow:0 0 12px rgba(255,255,255,.26);opacity:.42;animation:petalDrift 13s ease-in-out infinite}
@keyframes petalDrift{0%,100%{transform:translate3d(0,0,0) rotate(8deg)}50%{transform:translate3d(15px,-24px,0) rotate(82deg)}}
.global-float{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;display:none}
.global-float.on{display:block}
.global-petal{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.92),rgba(232,196,207,.42));box-shadow:0 0 14px rgba(255,255,255,.42);opacity:.28;animation:globalFloat 16s ease-in-out infinite;will-change:transform,opacity}
.global-petal:nth-child(3n){width:6px;height:6px;opacity:.2}
.global-petal:nth-child(4n){width:11px;height:11px;opacity:.2}
.global-petal.float-asset{background-color:transparent;border-radius:0;box-shadow:none;background-size:contain;background-repeat:no-repeat;background-position:center}
.home-petal.float-asset{background-color:transparent;border-radius:0;box-shadow:none;background-size:contain;background-repeat:no-repeat;background-position:center}
@keyframes globalFloat{0%,100%{transform:translate3d(0,0,0) scale(.82) rotate(0deg);opacity:.16}50%{transform:translate3d(12px,-28px,0) scale(1.14) rotate(24deg);opacity:.44}}
.nav,.wxtop,.np-top,.wbtop{background:rgba(249,238,242,.94);border-bottom-color:rgba(157,154,162,.16)}
.nav,.wxtop,.np-top,.wbtop{min-height:54px;flex:none}
.nav .ttl,.wxtop .h,.np-top .h,.wbtitle,.wbd-title{font-size:17px!important;font-weight:650!important;line-height:1.25!important;letter-spacing:0!important;color:var(--fg)}
.nav .back,.wxback{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.nav .back,.nav button.link,.wxback{color:var(--theme-rose-deep)}
.card{background:rgba(255,251,252,.74);border:1px solid rgba(157,154,162,.13);border-radius:22px;box-shadow:0 8px 24px rgba(157,154,162,.10);backdrop-filter:blur(15px)}
.lrow{border-bottom:0;border-radius:16px;margin:6px 0;padding:10px 12px;background:rgba(255,252,253,.62)}
.lrow:active{background:rgba(232,196,207,.55)}
.row>.av,.lrow .av,.avatar{background:linear-gradient(145deg,#d6a7b7,#c88fa3)}
button.btn{background:rgba(255,252,253,.78);border-color:rgba(157,154,162,.18);color:var(--fg);border-radius:14px;box-shadow:0 2px 8px rgba(157,154,162,.07)}
button.btn.primary{background:linear-gradient(135deg,#d7a5b7,#c88fa3);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(200,143,163,.26)}
button.btn.danger{background:rgba(255,245,246,.75);border-color:rgba(196,116,132,.28);color:var(--danger)}
input,textarea,select{background:rgba(255,252,253,.84);border-color:rgba(157,154,162,.18);border-radius:14px;color:var(--fg)}
input::placeholder,textarea::placeholder{color:#b3afb8}
.sheet{background:rgba(79,72,79,.34)}
.sheet .box,.sheet .box.full{background:#fffafb;color:var(--fg)}
.sheet .box h3{font-size:17px;color:var(--fg)}
.toast{background:rgba(111,108,115,.92);color:#fff}
.app .ic{background:linear-gradient(145deg,var(--theme-icon,#cfb9c2),var(--theme-icon-2,#bca3ae))!important;color:#fffafc!important;border:1px solid rgba(255,255,255,.38);border-radius:16px;box-shadow:0 7px 17px rgba(117,92,101,.18)}
.app .nm{color:var(--fg);text-shadow:0 1px 2px rgba(255,255,255,.45)}
.clock{margin:10px 18px 4px;padding:16px 14px 13px;border-radius:24px;background:rgba(255,250,252,.5);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 26px rgba(157,154,162,.1);backdrop-filter:blur(16px)}
.clock .t{font-size:56px;font-weight:250;color:var(--fg);letter-spacing:-1px}
.clock .d{color:var(--fg2)}
.home-widget{background:rgba(255,250,252,.58);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(15px);border-radius:18px;box-shadow:0 7px 22px rgba(157,154,162,.11)}
.hw-text{background:rgba(255,250,252,.44);padding:11px}
.hw-title{color:var(--fg);font-size:12.5px}
.hw-body{color:var(--fg2);font-size:11px}
.home-widget{position:relative;overflow:hidden;cursor:pointer}
.home-widget .hw-title,.home-widget .hw-body,.home-widget .hw-cap{position:relative;z-index:2}
.home-widget::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.55}
.shape-pill{border-radius:28px}
.shape-arch{border-radius:34px 34px 18px 18px}
.shape-ticket{border-radius:16px 24px 16px 24px}
.shape-frame{border:3px solid rgba(255,255,255,.62);border-radius:14px}
.shape-square{border-radius:11px}
.shape-bubble{border-radius:22px 22px 22px 8px}
.shape-vinyl{width:auto!important;height:calc(100% - 5px)!important;aspect-ratio:1;align-self:center;justify-self:center;border-radius:50%!important;background:#443a40!important;border-color:rgba(255,255,255,.46)!important;color:#5b4a51!important;isolation:isolate}
.shape-vinyl .hw-title,.shape-vinyl .hw-body{width:58%;max-width:84px;margin-left:auto;margin-right:auto;text-align:center;text-shadow:none;overflow:hidden}
.shape-vinyl .hw-title{font-size:11px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.shape-vinyl .hw-body{font-size:9px;line-height:1.28;margin-top:2px;opacity:.84;-webkit-line-clamp:2}
.shape-wings,.shape-cat{overflow:visible}
.shape-wings::before,.shape-cat::before{content:'';position:absolute;inset:0;z-index:0;border-radius:inherit;background:rgba(255,250,252,.74);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(15px)}
.shape-wings img,.shape-cat img{position:relative;z-index:1}
.shape-wings{border-radius:20px 20px 30px 30px}
.shape-wings .hw-title,.shape-wings .hw-body,.shape-wings .hw-cap{padding-left:9px;padding-right:9px}
.shape-cat{border-radius:46% 46% 20px 20px / 28% 28% 18px 18px}
.shape-cat.hw-text{padding:31px 10px 8px}
.shape-cat .hw-title{font-size:11.5px}
.shape-cat .hw-body{font-size:10px;line-height:1.45;-webkit-line-clamp:2}
.shape-cat .hw-cap{bottom:0;padding-top:18px}
.widget-deco{position:absolute;z-index:2;pointer-events:none}
.deco-vinyl{inset:3%;border-radius:50%;background:
  radial-gradient(circle at 50% 50%,#f7e4ea 0 36%,rgba(214,166,182,.94) 37% 40%,#352d32 41% 46%,transparent 47%),
  repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.13) 0 1px,transparent 2px 6px),
  conic-gradient(from 20deg,#55474f,#2e282c 20%,#594a53 43%,#2c272a 68%,#584a51 88%,#2e282c);
  border:1px solid rgba(255,255,255,.18);animation:vinylSpin 24s linear infinite}
.deco-vinyl::after{content:'';position:absolute;left:50%;top:50%;width:9%;aspect-ratio:1;border-radius:50%;background:#f8edf1;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(54,43,50,.65)}
.deco-vinyl img{position:absolute;left:50%;top:50%;width:34%;height:34%;object-fit:contain;transform:translate(-50%,-50%);opacity:.32;mix-blend-mode:screen}
.deco-wings{right:-7px;left:auto;bottom:-8px;width:52%;max-width:88px;transform:rotate(-8deg);transform-origin:70% 80%;z-index:1}
.deco-wings img{display:block;width:100%;height:auto;object-fit:contain;filter:saturate(.42) brightness(1.16);opacity:.46;animation:wingPulse 4.8s ease-in-out infinite}
.deco-cat{right:-4px;top:-6px;width:76px;height:64px;transform-origin:72% 78%}
.deco-cat img{display:block;width:100%;height:100%;object-fit:contain;filter:saturate(.65);opacity:.78;animation:catFloat 4.2s ease-in-out infinite}
.home-clock-widget{height:100%;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:10px 14px 9px;border-radius:22px;overflow:hidden;background:rgba(255,250,252,.58);border:1px solid rgba(255,255,255,.66);box-shadow:0 8px 22px rgba(157,154,162,.11)}
.home-clock-widget::before{content:'';position:absolute;inset:0;background:radial-gradient(rgba(200,143,163,.10) 1px,transparent 1.2px) 0 0/14px 14px;opacity:.72;pointer-events:none}
.clock-cat{position:absolute;right:14px;top:8px;width:46px;height:42px;object-fit:contain;opacity:.62;filter:saturate(.62);z-index:1;animation:catFloat 4.2s ease-in-out infinite;pointer-events:none}
.cat-clock{border-radius:42% 42% 22px 22px / 25% 25% 18px 18px}
.hcw-time,.hcw-meta,.hcw-week{position:relative;z-index:2}
.hcw-time{text-align:center;font-size:34px;line-height:1;font-weight:250;color:var(--fg);margin-top:8px}
.hcw-meta{text-align:center;font-size:9px;color:var(--fg2);margin-top:4px}
.hcw-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-top:7px}
.hcw-week span{font-size:7.5px;line-height:1;color:var(--fg2);padding:4px 0;border-radius:7px;background:rgba(255,252,253,.38)}
.hcw-week span.on{background:var(--theme-rose-deep);color:#fff}
.hw-bubble{height:100%;display:flex;align-items:center;gap:7px;padding:7px 9px;background:rgba(255,250,252,.48)}
.hw-bubble .bcat{width:26px;height:26px;object-fit:contain;filter:saturate(.68);flex:none;animation:catFloat 4.2s ease-in-out infinite}
.bubble-wing{position:absolute;right:-8px;top:-9px;width:38px;height:32px;transform:scaleX(-1) rotate(7deg);opacity:.34;pointer-events:none;z-index:1}
.bubble-wing img{width:100%;height:100%;object-fit:contain;filter:saturate(.34) brightness(1.24);animation:wingPulse 4.8s ease-in-out infinite}
.hw-bubble .bt{font-size:10px;font-weight:650;line-height:1.25;color:var(--fg)}
.hw-bubble .bd{font-size:8px;line-height:1.35;color:var(--fg2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.home-collage{height:100%;display:grid;grid-template-columns:minmax(56px,92px) minmax(0,1fr) minmax(56px,92px);gap:7px;align-items:center;padding:6px;border-radius:18px;background:rgba(255,250,252,.48);border:1px solid rgba(255,255,255,.66)}
.hcollage-slot{position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#eadce1,#d1dcd8);border:1px solid rgba(255,255,255,.7);cursor:pointer}
.hcollage-slot.sq{width:92px;height:92px;aspect-ratio:1;justify-self:center}
.hcollage-slot.wide{height:92px;width:100%;justify-self:stretch}
.hcollage-slot img{width:100%;height:100%;object-fit:cover;display:block}
.hcollage-slot .slot-edit{position:absolute;right:4px;bottom:4px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:rgba(111,108,115,.58);color:#fff;backdrop-filter:blur(5px)}
.home-calendar-widget{height:100%;padding:11px 13px;border-radius:20px;background:rgba(255,250,252,.55);border:1px solid rgba(255,255,255,.7);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.hcal-head{display:flex;align-items:center;justify-content:space-between;font-size:9px;color:var(--fg2)}.hcal-head b{font-size:12px;color:var(--fg)}
.hcal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.hcal-day{padding:4px 1px;border-radius:10px;font-size:8px;color:var(--fg2);background:rgba(255,255,255,.34)}
.hcal-day b{display:block;font-size:11px;color:var(--fg);margin-top:2px}
.hcal-day.on{background:var(--theme-rose-deep);color:#fff}.hcal-day.on b{color:#fff}
.hcal-foot{font-size:8px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-list-widget{height:100%;padding:10px 11px;border-radius:18px;background:rgba(255,250,252,.52);border:1px solid rgba(255,255,255,.68);overflow:hidden}
.hlist-title{font-size:11px;font-weight:650;color:var(--fg);margin-bottom:6px}.hlist-lines{display:flex;flex-direction:column;gap:5px}
.hlist-line{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlist-line i{width:11px;height:11px;border:1px solid var(--theme-rose-deep);border-radius:50%;flex:none;background:rgba(255,255,255,.35)}
.home-quote-widget{height:100%;padding:15px 17px;border-radius:20px;background:rgba(255,250,252,.55);border:1px solid rgba(255,255,255,.7);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.hquote-mark{position:absolute;right:12px;top:4px;font:64px/1 Georgia,serif;color:var(--theme-rose);opacity:.28}
.hquote-kicker{font-size:8px;letter-spacing:.12em;color:var(--theme-rose-deep);position:relative;z-index:1}
.hquote-text{font-size:15px;font-weight:650;line-height:1.5;color:var(--fg);margin-top:6px;position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.home-books-widget{height:100%;padding:11px;border-radius:18px;background:rgba(255,250,252,.52);border:1px solid rgba(255,255,255,.68);display:flex;flex-direction:column;overflow:hidden}
.hbooks-title{font-size:11px;font-weight:650;color:var(--fg);margin-bottom:7px}
.hbooks-row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1;min-height:0}
.hbook{position:relative;border-radius:7px 4px 4px 7px;background:linear-gradient(155deg,var(--theme-rose-soft),var(--theme-icon));padding:6px 5px;color:#fff;font-size:8px;line-height:1.35;overflow:hidden;box-shadow:2px 2px 8px rgba(76,60,69,.14);background-size:cover;background-position:center}
.hbook::before{content:'';position:absolute;left:3px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.hbook-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hbook.has-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(25,18,23,.62));z-index:1}
.hbook-name{position:relative;z-index:2;display:block;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.hstats-widget{height:100%;display:flex;align-items:center;justify-content:space-around;padding:6px 10px;border-radius:16px;background:rgba(255,250,252,.5);border:1px solid rgba(255,255,255,.64)}
.hstat{text-align:center;font-size:8px;color:var(--fg2)}.hstat b{display:block;font-size:12px;color:var(--fg);margin-bottom:2px}
@keyframes vinylSpin{to{transform:rotate(360deg)}}
@keyframes wingPulse{0%,100%{transform:scale(.96,.95)}50%{transform:scale(1.04,1)}}
@keyframes catFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.pattern-dots::after{background-image:radial-gradient(rgba(255,255,255,.9) 1.4px,transparent 1.4px);background-size:12px 12px}
.pattern-grid::after{background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:14px 14px}
.pattern-lines::after{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.48) 0 2px,transparent 2px 11px)}
.pattern-stars::after{background-image:radial-gradient(circle at 25% 25%,rgba(255,255,255,.95) 0 1.3px,transparent 1.7px),radial-gradient(circle at 75% 65%,rgba(255,255,255,.8) 0 1px,transparent 1.5px);background-size:22px 22px}
@media (max-height:760px){
  .home-mosaic{grid-auto-rows:52px;gap:6px;padding-top:2px}
  .home-mosaic{--desk-icon-size:44px}
  .home-mosaic .app .nm{font-size:9.5px}
  .hcw-time{font-size:28px;margin-top:5px}
  .hcw-week{margin-top:4px}.hcw-week span{font-size:7px;padding:3px 0}

function apiFriendly(status,msg){
  if(status===401||status===403) return 'API Key 无效或没有权限，请到设置里检查';
  if(status===404) return '接口地址不对，请检查 API 地址；DeepSeek 一般填到 /v1 这一层';
  if(status===429) return '接口请求太频繁，先等一会儿再试';

async function rawCall(ep,messages){
  const body={model:DB.api.model||'deepseek-chat',messages,temperature:Number(DB.api.temp)||0.9,stream:false};
  let r;

  }catch(e){

    }catch(e2){ throw e; }
  }
  const txt=await r.text(); let j={}; try{ j=JSON.parse(txt); }catch(e){}
  if(!r.ok){
    const raw=(j.error&&(j.error.message||j.error))||('接口返回 '+r.status);
    const err=new Error(apiFriendly(r.status,raw));
    err.status=r.status; throw err;
  }
  const out=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!out) throw new Error('接口没有返回内容');
  return out.trim();
}
async function callModel(messages){
  const base=normBase(DB.api.base||DB.api.endpoint);
  const list=[];
  if(DB.api.endpoint) list.push(DB.api.endpoint);
  chatCandidates(base).forEach(u=>{ if(list.indexOf(u)<0) list.push(u); });
  if(!list.length){ appLog('api','还没有填写对话 API 地址'); throw new Error('还没填 API 地址'); }
  let lastErr=null;
  for(let attempt=0;attempt<2;attempt++){
    let retry=false;
    for(const ep of list){
      try{
        const out=await rawCall(ep,messages);
        if(DB.api.endpoint!==ep){ DB.api.endpoint=ep; DB.api.base=base; save(); }
        return out;
      }catch(e){
        lastErr=e;
        if(e.status===404||e.status===405) continue;
        if(!e.status||e.status===429||e.status>=500||/没有返回内容/.test(e.message)){ retry=true; break; }
        throw e;
      }
    }
    if(retry&&attempt===0){ await new Promise(function(r){ setTimeout(r,1200); }); continue; }
    break;
  }
  if(lastErr&&!lastErr.status&&/fetch|network|failed/i.test(lastErr.message)) lastErr=new Error('网络连接失败，请检查网络或接口地址');
  if(lastErr) appLog('api','对话接口失败：'+lastErr.message);
  throw lastErr||new Error('连不上接口');
}
function splitBubbles(text){ return parseChatBubbles(text); }
function splitBubbleText(s){
  const t=String(s||'').trim();
  const sentences=t.match(/[^。！？!?；;\n]+[。！？!?；;]?/g)||[];
  if(sentences.length>=2){
    const mid=Math.ceil(sentences.length/2);
    return [sentences.slice(0,mid).join(''), sentences.slice(mid).join('')].filter(Boolean);
  }
  const clauses=t.match(/[^，,、：:\n]+[，,、：:]?/g)||[];
  if(clauses.length>=2){
    const mid=Math.ceil(clauses.length/2);
    return [clauses.slice(0,mid).join(''), clauses.slice(mid).join('')].filter(Boolean);
  }
  const chunks=t.split(/\s+/).filter(Boolean);
  if(chunks.length>=2){
    const mid=Math.ceil(chunks.length/2);
    return [chunks.slice(0,mid).join(' '), chunks.slice(mid).join(' ')].filter(Boolean);
  }
  return [t];
}
function parseChatBubbles(text){
  let t=String(text||'').trim();
  const sec=parseSections(t);
  const talk=sec.find(function(x){ return x.t==='对白'||x.t==='台词'||x.t==='Ta'; });
  if(talk) t=talk.lines.join('\n');
  t=t.replace(/【(旁白|对白|台词|Ta)】/g,'').replace(/''[^']*''/g,'');
  t=t.replace(/[（(][^（）()]{1,80}[）)]/g,'');
  let lines=t.split(/\|\|\||\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
  lines=lines.map(function(s){ return s.replace(/^["“「『]+|["”」』]+$/g,'').replace(/^(Ta|TA|ta|对白|台词|角色)[:：]\s*/,'').trim(); }).filter(Boolean);
  return lines;
}
function enforceBubbleCount(text,n){
  n=Math.max(1,Number(n)||1);
  let lines=parseChatBubbles(text);
  if(!lines.length) return [];
  while(lines.length>n){
    const last=lines.pop();
    if(!lines.length) break;
    lines[lines.length-1]=lines[lines.length-1]+' '+last;
  }
  while(lines.length<n){
    let idx=0;
    for(let i=1;i<lines.length;i++){ if(lines[i].length>lines[idx].length) idx=i; }
    if(lines[idx].length<=1) break;
    const parts=splitBubbleText(lines[idx]);
    if(parts.length<2) break;
    lines.splice(idx,1,...parts);
  }
  return lines.slice(0,n);
}

let dragKey=null,dragGhost=null,dragTimer=null,dragStart=null,suppressGoUntil=0;
function clearDrag(){
  if(dragTimer){ clearTimeout(dragTimer); dragTimer=null; }
  if(dragGhost){ dragGhost.remove(); dragGhost=null; }
  document.querySelectorAll('.app.drag-target,.app.drag-on').forEach(function(x){ x.classList.remove('drag-target','drag-on'); });
  document.body.classList.remove('app-dragging');
  dragKey=null; dragStart=null;
}
function bindDesktopDrag(){
  const grid=$('.grid'); if(!grid) return;
  grid.querySelectorAll('.app[data-app]').forEach(function(el){
    el.addEventListener('contextmenu',function(e){ if(dragKey) e.preventDefault(); });
    el.addEventListener('pointerdown',function(e){
      if(e.button!==undefined&&e.button!==0) return;
      dragStart={x:e.clientX,y:e.clientY,key:el.dataset.app};
      clearTimeout(dragTimer);
      dragTimer=setTimeout(function(){
        if(!dragStart) return;
        dragKey=dragStart.key;
        const r=el.getBoundingClientRect();
        dragGhost=el.cloneNode(true);
        dragGhost.className='app drag-ghost';
        dragGhost.style.left=r.left+'px'; dragGhost.style.top=r.top+'px';
        dragGhost.style.width=r.width+'px'; dragGhost.style.height=r.height+'px';
        document.body.appendChild(dragGhost);
        el.classList.add('drag-on');
        document.body.classList.add('app-dragging');
        if(navigator.vibrate) navigator.vibrate(10);
      },450);
    });
    el.addEventListener('pointermove',function(e){
      if(!dragStart) return;
      if(!dragKey){
        const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
        if(dx*dx+dy*dy>100){ clearTimeout(dragTimer); dragTimer=null; dragStart=null; }
        return;
      }
      e.preventDefault();
      if(dragGhost){ dragGhost.style.left=(e.clientX-30)+'px'; dragGhost.style.top=(e.clientY-30)+'px'; }
      const under=document.elementFromPoint(e.clientX,e.clientY);
      const target=under&&under.closest? under.closest('.grid .app[data-app]') : null;
      grid.querySelectorAll('.app.drag-target').forEach(function(x){ x.classList.remove('drag-target'); });
      if(target&&target.dataset.app!==dragKey) target.classList.add('drag-target');
    },{passive:false});
    el.addEventListener('pointerup',function(e){
      if(dragTimer){ clearTimeout(dragTimer); dragTimer=null; }
      if(!dragKey){ dragStart=null; return; }
      e.preventDefault();
      const under=document.elementFromPoint(e.clientX,e.clientY);
      const target=under&&under.closest? under.closest('.grid .app[data-app]') : null;
      if(target&&target.dataset.app!==dragKey){
        const keys=orderedApps().map(function(a){ return a.k; });
        const from=keys.indexOf(dragKey), to=keys.indexOf(target.dataset.app);
        if(from>=0&&to>=0){ keys.splice(from,1); keys.splice(to,0,dragKey); DB.ui.appOrder=keys; save(); }
      }
      suppressGoUntil=Date.now()+500;
      clearDrag(); render();
    });
    el.addEventListener('pointercancel',function(){ suppressGoUntil=Date.now()+500; clearDrag(); });
  });
}

function lv(n){ n=Number(n)||0; return n===0? '不主动' : ('等级 '+Math.min(5,n)); }
const AUTO_NAME=['从不','很少','少','正常','频繁','很频繁'];
const AUTO_GAP=['不会主动找你','大概 6 小时一条','大概 3 小时一条','大概 1 个半小时一条','大概 40 分钟一条','大概 15 分钟一条'];
function autoLabel(n){ return AUTO_NAME[Math.max(0,Math.min(5,Number(n)||0))]; }
function autoGapText(n){ return AUTO_GAP[Math.max(0,Math.min(5,Number(n)||0))]; }
function voiceModeOf(c){ return Math.max(0,Math.min(2,Number(c&&c.voiceFreq)||0)); }
function voiceModeLabel(n){ return ['不会发语音','偶尔发语音','经常发语音'][voiceModeOf({voiceFreq:n})]; }
function voiceModeChance(n){ return voiceModeOf({voiceFreq:n})===2?.55:(voiceModeOf({voiceFreq:n})===1?.22:0); }

const settleTimers={};
function scheduleReply(ch,nudge){
  const s=Number(ch&&ch.settle)||0;
  const run=function(){ curChatId=ch.id; aiTurn(nudge? {nudge:nudge}:undefined).catch(function(){}); };
  if(!s){ run(); return; }
  clearTimeout(settleTimers[ch.id]);
  settleTimers[ch.id]=setTimeout(function(){ delete settleTimers[ch.id]; run(); }, s*1000);
}

  const cur=Number(ch.settle)||0;
  const opts=[0,3,5,8,12];

function parseTurn(text,name){
  const raw=String(text||'').split(/【货架】/)[0].trim();
  const out={narr:[],talk:[]};
  if(!raw) return out;
  const sec=parseSections(raw);
  const g=function(n){ const s=sec.find(function(x){ return x.t===n; }); return s? s.lines.join('\n').trim() : ''; };
  let srcNarr=g('旁白'), srcTalk=g('对白')||g('Ta')||g('台词');
  if(!srcNarr && !srcTalk) srcNarr=raw;
  const talks=[];
  const pull=function(s){
    if(!s) return '';
    let o=String(s).replace(/[“"「『]([^”"」』]{1,600})[”"」』]/g,function(m,inner){ talks.push(inner.trim()); return '\n'; });
    o=o.replace(/[“"「『]([^”"」』\n]{1,600})$/gm,function(m,inner){ talks.push(inner.trim()); return ''; });
    return o;
  };
  const narrRest=pull(srcNarr);
  const talkRest=pull(srcTalk);
  if(srcTalk && !talks.length && String(srcTalk).trim()) talks.push(String(srcTalk).trim());
  const toParas=function(s){
    return String(s||'').split(/\n+/).map(function(x){ return cleanNarr(x); }).filter(Boolean);
  };
  out.narr=toParas([narrRest,(talks.length? talkRest:'')].filter(Boolean).join('\n'));
  out.talk=toParas(talks.join('\n')).map(function(p){ return /^(无|没有|（无）|\(无\)|none|None)$/i.test(String(p).trim())? '……' : p; });
  const tset=out.talk.map(normLine).filter(Boolean);
  out.narr=out.narr.filter(function(p){
    const n=normLine(p);
    if(!n) return false;
    return !tset.some(function(t){ return t && (n===t || (t.length>8 && n.indexOf(t)>=0)); });
  });
  const seen={};
  out.narr=out.narr.filter(function(p){ const k=normLine(p).slice(0,30); if(!k||seen[k]) return false; seen[k]=1; return true; });

  return out;
}
function stripSpeakers(s,name){
  let t=String(s||'');
  t=t.replace(/^[ \t]*(Ta|TA|ta|对白|台词)[ \t]*[:：][ \t]*/gm,'');

function splitNarrTalk(text,name){
  const raw=String(text||'').trim();

  const sec=parseSections(raw);
  const g=function(n){ const s=sec.find(function(x){ return x.t===n; }); return s? s.lines.join('\n').trim() : ''; };
  let srcNarr=g('旁白'), srcTalk=g('对白')||g('Ta')||g('台词');
  if(!srcNarr && !srcTalk) srcNarr=raw;

  const pull=function(s){
    if(!s) return '';

    out=out.replace(/[“"「『]([^”"」』\n]{1,500})$/gm, function(m,inner){ talks.push(inner.trim()); return ''; });

  };
  const narrRest=pull(srcNarr);
  const talkRest=pull(srcTalk);
  if(srcTalk && !talks.length && String(srcTalk).trim()) talks.push(String(srcTalk).trim());
  const narr=cleanNarr(stripSpeakers([narrRest,(talks.length? talkRest:'')].filter(Boolean).join('\n'),name));

let uiAudioCtx=null;
function playTonePreset(preset,vol,kind){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    uiAudioCtx=uiAudioCtx||new AC();
    if(uiAudioCtx.state==='suspended') uiAudioCtx.resume().catch(function(){});
    const now=uiAudioCtx.currentTime;
    const gap=Number(preset.gap)||.055, type=preset.type||'sine', gain=Number(preset.gain)||.12;
    (preset.freqs||[]).forEach(function(freq,i){
      const o=uiAudioCtx.createOscillator(), g=uiAudioCtx.createGain();
      const t=now+i*gap, shift=kind==='send'?80:(kind==='receive'?-35:0);
      o.type=type;
      o.frequency.setValueAtTime(Math.max(80,freq+shift),t);
      if(preset.bend) o.frequency.exponentialRampToValueAtTime(Math.max(80,preset.bend),t+preset.dur);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(Math.max(.001,vol*gain),t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+preset.dur);
      o.connect(g); g.connect(uiAudioCtx.destination); o.start(t); o.stop(t+preset.dur+.02);
    });
  }catch(e){}
}

}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));/* ---- AI 回合 ---- */
async function aiTurn(opt){
  const ch=chat(curChatId||route.arg); if(!ch) return;
  const members=ch.memberIds.map(ct).filter(Boolean);
  if(!members.length) return;
  if(!DB.api.key){ toast('先到「设置」里填 API Key'); return; }
  const speaker=(opt&&opt.speaker)||(ch.type==='group'? pick(members) : members[0]);
  if(!speaker) return;
  const min=Math.max(1,Number(ch.replyMin)||1);
  const max=Math.max(min,Number(ch.replyMax)||Math.max(3,min));
  const want=min+Math.floor(Math.random()*(max-min+1));
  const lastUser=[].concat(ch.msgs||[]).reverse().find(function(m){ return m.role==='me'&&!m.recalled; });
  const wantsVoice=!!(lastUser&&/(发.{0,5}语音|语音条|用语音|听.{0,4}声音|听听你|发条语音)/.test(labelOf(lastUser)));
  setTyping(true, ch.type==='group'? (speaker.name+' 正在输入…') : '对方正在输入…');
  try{
    const history=ch.msgs.filter(m=>m.role!=='sys').slice(-24).map(m=>({role:m.role==='me'?'user':'assistant',content:labelOf(m)}));
    const others=ch.type==='group'? members.filter(x=>x.id!==speaker.id).map(x=>x.name):[];
    let sys=promptOf(speaker, others, ch.msgs.slice(-6), {format:'chat'})+'\n'+memoryBlockForChat(ch.id);
    if(ch.mem&&ch.mem.items&&ch.mem.items.length) sys+='\n【这段会话里你记得的事】\n'+ch.mem.items.map(function(x){ return '- '+x; }).join('\n');
    if(opt&&opt.nudge) sys+='\n【这次的特别要求】'+opt.nudge;
    sys+='\n【语音规则】你可以在微信里直接发语音。你知道怎么发，不需要检查设备、接口、权限或任何技术条件。绝对不要说设备不匹配、接口未配置、暂时不能发语音或语音功能不可用；对方让你发语音时，直接发就好。';
    sys+='\n【本次气泡数量】本次必须正好输出 '+want+' 个气泡，每个气泡单独一行。绝不合并，绝不多发，绝不改数量。用户可能用空格代替标点，气泡之间必须用换行分隔，不要在词中间断行。';
    const out=await callModel([{role:'system',content:sys}].concat(history));
    const clean=regexOf(speaker, out);
    if(!clean) throw new Error('模型没有返回内容');
    await sleep(Math.min(1600, 240 + clean.length*12));
    const t0=$('#typing'); if(t0) t0.remove();
    const badVoice=/设备不匹配|未配置.{0,6}(接口|语音)|接口.{0,6}未配置|不能发语音|发不了语音|没法发语音|不支持语音|语音功能.{0,6}(不可用|未配置)/;
    const parts=enforceBubbleCount(clean,want).map(function(t){ return badVoice.test(t)?'好，我发给你。':t; });
    if(!parts.length) throw new Error('没有可发送的气泡');
    let sentVoice=false;
    for(let pi=0;pi<parts.length;pi++){
      const t=parts[pi];
      const asVoice=(wantsVoice&&pi===0)||(!sentVoice&&Math.random()<voiceModeChance(speaker.voiceFreq));
      if(asVoice){
        sentVoice=true;
        pushMsg(ch.id,{role:'ta',from:speaker.id,type:'voice',text:t,duration:voiceSeconds({text:t})});
      }else{
        pushMsg(ch.id,{role:'ta',from:speaker.id,type:'text',text:t});
      }
      if(parts.length>1) await sleep(420);
    }
    if(ch.type==='group'&&members.length>1&&Math.random()<0.35){
      const other=pick(members.filter(x=>x.id!==speaker.id));
      if(other){ await sleep(900); await aiTurn({speaker:other,nudge:'群里刚有人说话了，你插一句嘴，一两句就行。'}); }
    }
  }catch(e){
    setTyping(false);
    toast('出错：'+e.message);
  }
}

/* ---- 语音条 ---- */
function hexToBytes(hex){ const out=new Uint8Array(hex.length/2); for(let i=0;i<out.length;i++) out[i]=parseInt(hex.substr(i*2,2),16); return out; }
async function synthesizeVoice(text){
  const a=DB.audio||{};
  if(!a.key||!a.voiceId) throw new Error('还没有填写语音 API Key 和音色 ID');
  const provider=a.provider||'minimax';
  if(provider==='openai'){
    const r=await fetch(a.endpoint||'https://api.openai.com/v1/audio/speech',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.key},
      body:JSON.stringify({model:a.model||'tts-1',input:String(text||''),voice:a.voiceId,response_format:'mp3'})
    });
    if(!r.ok){ const t=await r.text(); throw new Error(t.slice(0,120)||('HTTP '+r.status)); }
    const blob=await r.blob(); if(!blob.size) throw new Error('接口没有返回音频');
    return URL.createObjectURL(blob);
  }
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+a.key};
  if(a.groupId) headers.GroupId=a.groupId;
  const r=await fetch(a.endpoint||'https://api.minimax.chat/v1/t2a_v2',{
    method:'POST',headers,
    body:JSON.stringify({model:a.model||'speech-01-turbo',text:String(text||''),stream:false,
      voice_setting:{voice_id:a.voiceId,speed:1,vol:1,pitch:0},
      audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3',channel:1}})
  });
  const txt=await r.text(); let j={}; try{ j=JSON.parse(txt); }catch(e){}
  const hex=j.data&&(j.data.audio||j.data.audio_file);
  if(!r.ok||!hex) throw new Error((j.base_resp&&j.base_resp.status_msg)||txt.slice(0,100)||('HTTP '+r.status));
  const blob=new Blob([hexToBytes(hex)],{type:'audio/mpeg'});
  return URL.createObjectURL(blob);
}
async function playVoice(m){
  if(m.url){ new Audio(m.url).play(); return; }
  if(!(DB.audio&&DB.audio.key&&DB.audio.voiceId)){ toast('先在「设置 → 语音与朗读」里填语音 API Key 和音色 ID'); return; }
  toast('正在合成语音…');
  try{
    m.url=await synthesizeVoice(m.text);
    const au=new Audio(m.url);
    m.playing=true;
    if(route.name==='chatroom') render();
    au.onloadedmetadata=function(){ const d=Math.round(Number(au.duration)||0); if(d>0&&d!==Number(m.duration)){ m.duration=d; if(route.name==='chatroom') render(); } };
    au.onended=function(){ m.playing=false; if(route.name==='chatroom') render(); };
    au.onerror=function(){ m.playing=false; if(route.name==='chatroom') render(); };
    await au.play();
  }catch(e){ m.playing=false; appLog('voice','语音合成失败：'+e.message); toast('合成失败：'+e.message); }
}
async function testVoiceConfig(){
  if(!(DB.audio&&DB.audio.key&&DB.audio.voiceId)){ toast('先填语音 API Key 和音色 ID'); return; }

function momentNewCount(){ return (DB.notifs||[]).filter(n=>!n.read).length; }
function momentById(id){ return (DB.moments||[]).find(m=>m.id===id)||null; }
function shareTie(a,b){ // 两个联系人是否因为同一本世界书/同一条正则而能互相看见
  if(!a||!b||a.id===b.id) return true;
  const w=(a.worldIds||[]).some(x=>(b.worldIds||[]).includes(x));
  const r=(a.regexIds||[]).some(x=>(b.regexIds||[]).includes(x));
  return w||r;
}
function visibleTo(p,c){ // p 这条朋友圈，c 这个联系人能不能看见
  if(!c) return true;
  if(p.by==='me'){
    const who=p.who||{type:'public'};
    if(who.type==='ids') return (who.ids||[]).includes(c.id);
    if(who.type==='group') return (who.groups||[]).includes(c.groupId);
    return true;
  }
  if(p.by===c.id) return true;
  return shareTie(ct(p.by), c);
}
function whoText(p){
  const who=p.who||{type:'public'};
  if(who.type==='ids') return '仅 '+(who.ids||[]).map(i=>{const c=ct(i);return c?c.name:'?';}).join('、')+' 可见';
  if(who.type==='group') return '仅 '+(who.groups||[]).map(i=>{const g=(DB.groups||[]).find(x=>x.id===i);return g?g.name:'?';}).join('、')+' 可见';
  return '公开';
}

function addNotif(text){ DB.notifs=DB.notifs||[]; DB.notifs.unshift({id:uid(),text,ts:Date.now(),read:false}); }
function authorName(p){ return p.by==='me'? '你' : ((ct(p.by)||{}).name||'某人'); }
async function genPost(c){
  const sys=promptOf(c,null,[])
    +'\n【这次的任务】你不是在和用户聊天，而是在发一条朋友圈。第一人称，一到三句，像真人随手发的日常，可以有情绪和细节，不要话题标签，不要写成作文，不要问用户问题。';
  const out=await callModel([{role:'system',content:sys},{role:'user',content:'发一条朋友圈。'}]);
  const text=regexOf(c,out).replace(/''/g,'').replace(/^["「]|["」]$/g,'').trim();
  if(!text) return null;
  const m={id:uid(),by:c.id,text,images:[],place:'',who:{type:'public'},ts:Date.now(),likes:[],comments:[]};
  DB.moments.unshift(m); c.lastPost=Date.now(); save();
  if(wtab==='moments') render();
  return m;
}
function genLike(c,m){
  m.likes=m.likes||[]; if(m.likes.some(l=>l.by===c.id)) return;
  m.likes.push({by:c.id,ts:Date.now()});
  if(m.by==='me') addNotif(c.name+' 赞了你的朋友圈');
  save();
}
async function genComment(c,m){
  const body=(m.text||'')+((m.images||[]).length? '（配了图）':'');
  const sys=promptOf(c,null,[])
    +'\n【这次的任务】你在刷朋友圈，给「'+authorName(m)+'」发的那条留一条评论。只输出评论本身，一句话，像真人评论，不要写你的名字，不要加引号。';
  const out=await callModel([{role:'system',content:sys},{role:'user',content:'这条朋友圈的内容是：'+body}]);
  const text=regexOf(c,out).replace(/''/g,'').replace(/^\s*["「]|["」]\s*$/g,'').trim();
  if(!text) return;
  m.comments=m.comments||[]; m.comments.push({id:uid(),by:c.id,text:text,ts:Date.now(),replies:[]});
  if(m.by==='me') addNotif(c.name+' 评论了你的朋友圈：'+text.slice(0,20));
  save(); if(wtab==='moments') render();
}
async function genReply(c,m,cm){
  const sys=promptOf(c,null,[])
    +'\n【这次的任务】在朋友圈里，回复「'+((cm.by==='me')?'你':((ct(cm.by)||{}).name||'某人'))+'」的评论。只输出回复内容，一句话。';
  const out=await callModel([{role:'system',content:sys},{role:'user',content:'朋友圈：'+((m.text||'').slice(0,80))+'\n对方评论：'+cm.text}]);
  const text=regexOf(c,out).replace(/''/g,'').trim();
  if(!text) return;
  cm.replies=cm.replies||[]; cm.replies.push({id:uid(),by:c.id,text:text,ts:Date.now()});
  if(cm.by==='me') addNotif(c.name+' 回复了你的评论：'+text.slice(0,20));
  save(); if(wtab==='moments') render();
}
async function contactsReact(){
  if(!DB.api.key||!DB.auto) return;
  const mine=(DB.moments||[]).filter(p=>p.by==='me').slice(0,2);
  if(!mine.length) return;
  for(const c of DB.contacts){
    const f=c.freq||{}; let act=0;
    const target=mine.filter(p=>visibleTo(p,c))[0];
    if(!target) continue;
    if((Number(f.like)||0) && Math.random()<(Number(f.like)||0)/6){ genLike(c,target); act++; }
    if((Number(f.comment)||0) && Math.random()<(Number(f.comment)||0)/6){ try{ await genComment(c,target); }catch(e){} act++; }
    if(act) await sleep(700);
  }
  render();
}
async function contactReplyToMyComment(pid){
  if(!DB.api.key||!DB.auto) return;
  const m=momentById(pid); if(!m) return;
  let cm=null, best=0;
  (m.comments||[]).forEach(x=>{
    if(x.by==='me' && (x.ts||0)>best){ best=x.ts||0; cm=x; }
    (x.replies||[]).forEach(r=>{ if(r.by==='me' && (r.ts||0)>best){ best=r.ts||0; cm=x; } });
  });
  if(!cm) return;
  const cands=DB.contacts.filter(c=>visibleTo(m,c)&&(Number((c.freq||{}).reply)||0)>0);
  if(!cands.length) return;
  try{ await genReply(pick(cands),m,cm); }catch(e){}
}
async function autoMoments(){
  if(!DB.api.key||!DB.auto) return;
  const now=Date.now(); let budget=2, posted=0;
  for(const c of DB.contacts){
    if(posted>=1) break;
    const f=c.freq||{}, post=Number(f.post)||0; if(!post) continue;
    const gap=[0,20,10,5,2,1][Math.min(5,post)]*60000;
    if(now-(c.lastPost||0)<gap) continue;
    if(Math.random()<0.55){ try{ await genPost(c); posted++; }catch(e){} await sleep(600); }
  }
  const posts=(DB.moments||[]).filter(p=>now-(p.ts||0)<86400000);
  if(!posts.length) return;
  for(const c of DB.contacts){
    if(budget<=0) break;
    const f=c.freq||{};
    const vis=posts.filter(p=>p.by!==c.id&&visibleTo(p,c));
    if(!vis.length) continue;
    const t=pick(vis);
    if((Number(f.like)||0)&&Math.random()<(Number(f.like)||0)/10){ genLike(c,t); budget--; }
    else if((Number(f.comment)||0)&&Math.random()<(Number(f.comment)||0)/10){ try{ await genComment(c,t); budget--; }catch(e){} await sleep(600); }
    else if((Number(f.reply)||0)&&Math.random()<(Number(f.reply)||0)/14){
      const cs=(t.comments||[]).filter(x=>x.by!=='me'&&!(x.replies||[]).some(r=>r.by===c.id));
      if(cs.length){ try{ await genReply(c,t,pick(cs)); budget--; }catch(e){} await sleep(600); }
    }
  }
}

const SYSWORLD=`【系统硬规则·功能格式总表｜每次生成只执行当前功能这一节】

0. 总则
- 每个功能只输出当前功能要求的内容。旁白、动作、对白、系统提示不能混到别的功能里。
- 不输出 Markdown、代码块、解释、规则复述。
- 提到用户一律用「你」。
- 角色说话不加引号、不加说话人标签。
- 任何功能都禁止生成用户本人（用户人设）的帖子、评论、回复、点赞、转发或私信。

1. 微信聊天
- 只输出聊天气泡，不写旁白、动作、神态、环境、心理描写。
- 一个气泡一行，不合并。没有台词就写：……
- 不加括号、星号、引号、说话人标签。
- 每次气泡数量按本次任务指定的数量输出，不多不少。
- 用户可能用空格代替逗号和句号；不要因此把词拆开，气泡之间用换行分隔。\n- 正确：【在干嘛呢？想你了】【你今天有没有好好吃饭呀？】【宝宝不按时吃饭的话 胃会不舒服的】
- 禁止：把三句塞进一个气泡；在气泡里写【旁白】；用（）写动作。
- 拍一拍之后也要发气泡，不要只发系统提示。

2. 日记
- 第一人称日记正文，纯散文。
- 不出现【旁白】【对白】标题，不写对话剧本，不写系统提示。
- 200 字左右，写当天的心情和具体小事。

3. 朋友圈
- 发朋友圈：第一人称正文，一到三句，不写旁白/对白标题，不写系统说明。
- 评论/回复：只输出一句评论或回复本身，不加名字、不加引号。

4. 微博
- 发博：只输出微博正文，不写旁白/对白标题。
- 评论、回复、转发语、私信：只输出那一条文本，不加名字、不加引号。
- 微博正文必须符合发帖角色的人设、性格、身份和说话习惯，不写成新闻稿。
- 禁止生成用户本人的帖子、评论、回复、点赞或转发。

5. 约会 / 出门
- 这是唯一允许写旁白的板块。
- 用【旁白】【对白】两段。旁白写动作、神态、心理、环境；对白只写角色说出口的话，一句一行。
- 旁白不出现台词；对白不加引号、不加括号、不加说话人标签。
- 提到用户用「你」。

6. 查手机
- 严格按【最近聊天】【通话记录】【相册】【备忘录】【消费记录】五个标题输出。

7. 此刻状态
- 严格按【地点】【正在做】【心情】【手机】【想法】【好感度】【爱意】【愤怒】【性欲】【理智】【占有欲】【恨意】【厌恶值】输出。

- 百分比写 0 到 100 的数字。

8. 打卡

9. 小说 / 拍立得 / 订单小片段
- 小说和订单小片段：只写纯散文画面，不写【旁白】【对白】标题。

async function fetchModelList(){
  readApiForm();
  const base=normBase(DB.api.base), key=DB.api.key||'';
  if(!base){ toast('先填 API 地址'); return; }
  const btn=$('#s_models'); if(btn) btn.textContent='拉取中…';
  let msg='';
  for(const u of modelCandidates(base)){
    try{
      const r=await fetch(u,{headers:{'Authorization':'Bearer '+key}});
      if(!r.ok){
        if(r.status===401||r.status===403){ msg='Key 不对，或这个 Key 没有权限（'+r.status+'）'; break; }
        msg='接口返回 '+r.status; continue;
      }
      const j=await r.json();
      const ids=(j.data||j.models||[]).map(x=>x.id||x.name).filter(Boolean).sort();
      if(!ids.length){ msg='拉到了，但里面没有模型名'; continue; }
      DB.api.base=normBase(base); DB.api.endpoint=''; DB.api.modelList=ids;
      if(!DB.api.model || ids.indexOf(DB.api.model)<0) DB.api.model=ids[0];
      DB.api.listMsg='已拉取 '+ids.length+' 个模型，点模型那一格就能下拉选。';
      save(); render(); toast('拉到了 '+ids.length+' 个模型');
      return;
    }catch(e){ msg='被浏览器跨域挡住了（'+String(e.message).slice(0,28)+'）'; }
  }
  DB.api.listMsg='拉取失败：'+msg+'  可以直接用预设的模型名，或手动填一个。';
  save(); render();
}
function decorateSettingsBubbles(root){
  const pad=root&&root.querySelector?root.querySelector('.pad'):null;
  if(!pad||pad.dataset.bubblesReady) return;
  pad.dataset.bubblesReady='1';
  const iconMap={'对话接口':'chat','语音朗读':'speaker','角色自动活动':'sparkles','显示与字体':'pen','外观与美化':'palette','低性能模式':'flame','全屏模式':'eye','消息提示音':'bell','点击音效':'music','后台与通知':'bell','数据管理':'grid','自检':'check','关于小手机':'at','免责声明':'lock','示例手机':'gift','示例内容':'gift','上架模式':'lock'};
  Array.from(pad.children).filter(function(el){ return el.classList&&el.classList.contains('card'); }).forEach(function(card,idx){
    const direct=Array.from(card.children).find(function(x){ return x.tagName==='B'; });
    const titleEl=direct||card.querySelector('.lrow .t1')||card.querySelector('.row b');
    const title=titleEl?String(titleEl.textContent||'').trim():('设置 '+(idx+1));
    if(!title) return;
    const descEl=card.querySelector(':scope > .muted, :scope > .row .muted, .lrow .t2');
    const desc=descEl?String(descEl.textContent||'').trim():'';
    const bubble=document.createElement('section');
    bubble.className='settings-bubble';
    bubble.dataset.setkey='settings_'+idx;
    bubble.innerHTML='<button type="button" class="settings-head"><span class="si">'+ic(iconMap[title]||'gear',18)+'</span><span class="sg"><b>'+esc(title)+'</b></span><span class="chev">›</span></button><div class="settings-body"></div>';
    card.parentNode.insertBefore(bubble,card);
    bubble.querySelector('.settings-body').appendChild(card);
    if(direct&&direct.parentNode===card) direct.classList.add('settings-title-dup');
    if(DB.ui.settingsOpen===bubble.dataset.setkey) bubble.classList.add('open');
    bubble.querySelector('.settings-head').onclick=function(){
      const open=!bubble.classList.contains('open');
      pad.querySelectorAll('.settings-bubble.open').forEach(function(x){ x.classList.remove('open'); });
      bubble.classList.toggle('open',open);
      DB.ui.settingsOpen=open?bubble.dataset.setkey:'';
      save();
    };
  });
}

function pickCropped(ratio,max,cb,fmt){

    const fr=new FileReader();

    fr.readAsDataURL(i.files[0]);

  i.click();

function openCropper(img,ratio,max,cb,fmt){
  const RS=[['1:1',1],['3:4',3/4],['4:3',4/3],['9:16',9/16],['16:9',16/9],['原图',img.width/img.height],['自由',0]];
  const st={ratio:Number(ratio)>0? Number(ratio) : (img.width/img.height), scale:1, tx:0, ty:0, base:1, fw:0, fh:0, free:false};
  let hit=-1;
  RS.forEach((r,i)=>{ if(Math.abs(r[1]-st.ratio)<0.002) hit=i; });
  const ov=document.createElement('div'); ov.id='cropOv';
  ov.innerHTML='<div class="cr-top"><button id="crCancel">取消</button><div>调整图片</div><div style="width:44px"></div></div>'
    +'<div class="cr-stage" id="crStage"><div class="cr-frame" id="crFrame"><img id="crImg"><div class="cr-grid"></div><div class="cr-e e-t" data-edge="t"></div><div class="cr-e e-b" data-edge="b"></div><div class="cr-e e-l" data-edge="l"></div><div class="cr-e e-r" data-edge="r"></div></div></div>'
    +'<div class="cr-ctl"><div class="cr-rs" id="crRs">'+RS.map((r,i)=>'<button data-r="'+i+'"'+(i===hit?' class="on"':'')+'>'+r[0]+'</button>').join('')+'</div>'
    +'<div class="cr-zoom"><span>小</span><input type="range" id="crZoom" min="100" max="320" value="100"><span>大</span></div>'
    +'<button class="cr-ok" id="crOk">用这张</button></div>';
  document.body.appendChild(ov);
  const frame=ov.querySelector('#crFrame'), im=ov.querySelector('#crImg');
  im.src=img.src;
  const paint=()=>{
    const w=img.width*st.base, h=img.height*st.base;
    im.style.width=w+'px'; im.style.height=h+'px';
    const dw=w*st.scale, dh=h*st.scale;
    const mx=Math.max(0,(dw-st.fw)/2), my=Math.max(0,(dh-st.fh)/2);
    st.tx=Math.min(mx,Math.max(-mx,st.tx)); st.ty=Math.min(my,Math.max(-my,st.ty));
    im.style.transform='translate(-50%,-50%) translate('+st.tx+'px,'+st.ty+'px) scale('+st.scale+')';
  };
  const fit=()=>{
    const stage=ov.querySelector('#crStage');
    const sw=stage.clientWidth-26, sh=stage.clientHeight-26;
    if(!st.free){ let fw=sw, fh=fw/st.ratio; if(fh>sh){ fh=sh; fw=fh*st.ratio; } st.fw=fw; st.fh=fh; }
    st.fw=Math.min(st.fw,sw); st.fh=Math.min(st.fh,sh);
    frame.style.width=st.fw+'px'; frame.style.height=st.fh+'px';
    st.base=Math.max(st.fw/img.width, st.fh/img.height);
    st.tx=0; st.ty=0; st.scale=1; paint();
  };
  let drag=null;
  frame.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,tx:st.tx,ty:st.ty}; try{ frame.setPointerCapture(e.pointerId); }catch(err){} });
  frame.addEventListener('pointermove',e=>{ if(!drag) return; st.tx=drag.tx+(e.clientX-drag.x); st.ty=drag.ty+(e.clientY-drag.y); paint(); });
  frame.addEventListener('pointerup',()=>{ drag=null; });
  frame.addEventListener('pointercancel',()=>{ drag=null; });
  frame.addEventListener('wheel',e=>{ e.preventDefault(); st.scale=Math.min(3.2,Math.max(1,st.scale-e.deltaY/600)); ov.querySelector('#crZoom').value=Math.round(st.scale*100); paint(); },{passive:false});
  ov.querySelector('#crZoom').oninput=e=>{ st.scale=Number(e.target.value)/100; paint(); };
  const edges=[].slice.call(ov.querySelectorAll('.cr-e'));
  const showEdges=function(v){ edges.forEach(function(el){ el.style.display=v? 'block':'none'; }); };
  ov.querySelectorAll('#crRs button').forEach(b=>b.onclick=()=>{
    const rr=RS[Number(b.dataset.r)];
    ov.querySelectorAll('#crRs button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    st.scale=1; ov.querySelector('#crZoom').value=100;
    if(rr[1]===0){
      st.free=true; showEdges(true);
      const stage=ov.querySelector('#crStage');
      const sw=stage.clientWidth-26, sh=stage.clientHeight-26;
      if(!st.fw){ st.fw=sw; st.fh=Math.min(sh,sw); }
      fit();
    }else{
      st.free=false; showEdges(false);
      st.ratio=rr[1]; fit();
    }
  });
  const startResize=function(e,edge){
    e.preventDefault(); e.stopPropagation();
    const stage=ov.querySelector('#crStage');
    const sw=stage.clientWidth-26, sh=stage.clientHeight-26;
    const s0={x:e.clientX,y:e.clientY,w:st.fw,h:st.fh};
    const mv=function(ev){
      const dx=ev.clientX-s0.x, dy=ev.clientY-s0.y;
      let w=s0.w, h=s0.h;
      if(edge==='l'||edge==='r') w=Math.max(56,Math.min(sw, s0.w + (edge==='r'? dx : -dx)));
      if(edge==='t'||edge==='b') h=Math.max(56,Math.min(sh, s0.h + (edge==='b'? dy : -dy)));
      st.fw=w; st.fh=h;
      frame.style.width=w+'px'; frame.style.height=h+'px';
      st.base=Math.max(w/img.width, h/img.height);
      paint();
    };
    const up=function(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); };
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
  };
  edges.forEach(function(el){ el.addEventListener('pointerdown',function(e){ startResize(e, el.dataset.edge); }); });
  ov.querySelector('#crCancel').onclick=()=>ov.remove();
  ov.querySelector('#crOk').onclick=()=>{
    const k=1/(st.base*st.scale);
    const sw2=st.fw*k, sh2=st.fh*k;
    const cx=img.width/2 - st.tx*k, cy=img.height/2 - st.ty*k;
    const sx=Math.max(0,Math.min(img.width-sw2, cx-sw2/2));
    const sy=Math.max(0,Math.min(img.height-sh2, cy-sh2/2));
    const outW=Math.min(sw2, max||1200);
    const sc=outW/sw2;
    const cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(sw2*sc)); cv.height=Math.max(1,Math.round(sh2*sc));
    const ctx=cv.getContext('2d');
    if(fmt!=='png'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); }
    ctx.drawImage(img, sx, sy, sw2, sh2, 0, 0, cv.width, cv.height);
    const url=cv.toDataURL(fmt==='png'?'image/png':'image/jpeg',0.88);
    ov.remove();
    if(cb) cb(url);
  };
  requestAnimationFrame(fit);
}

function npBindChipEditor(root,state){
  if(!root) return;
  if(root._npChipHandler) root.removeEventListener('click',root._npChipHandler);
  const render=function(){
    Object.keys(state).forEach(function(key){
      const box=root.querySelector('[data-chip-selected="'+key+'"]'); if(box) box.innerHTML=npChipHTML(key,state[key]);
      root.querySelectorAll('[data-chip-add="'+key+'"]').forEach(function(b){ b.classList.toggle('on',state[key].indexOf(b.dataset.value)>=0); });
    });
  };
  const add=function(key,v){ v=String(v||'').trim(); if(!v) return; if(state[key].indexOf(v)<0) state[key].push(v); render(); };
  root._npChipHandler=function(ev){
    const addEl=ev.target.closest('[data-chip-add]');
    if(addEl){ add(addEl.dataset.chipAdd,addEl.dataset.value); return; }
    const custom=ev.target.closest('[data-chip-custom]');
    if(custom){ const key=custom.dataset.chipCustom; const input=root.querySelector('[data-chip-input="'+key+'"]'); add(key,input&&input.value); if(input) input.value=''; return; }
    const del=ev.target.closest('[data-chip-del]');
    if(del){ const key=del.dataset.chipDel, i=Number(del.dataset.chipIndex); state[key].splice(i,1); render(); return; }
    const mv=ev.target.closest('[data-chip-move]');
    if(mv){ const key=mv.dataset.chipMove, i=Number(mv.dataset.chipIndex), j=i+Number(mv.dataset.chipDelta); if(j<0||j>=state[key].length) return; const t=state[key][i]; state[key][i]=state[key][j]; state[key][j]=t; render(); }
  };
  root.addEventListener('click',root._npChipHandler);
  root.querySelectorAll('[data-chip-input]').forEach(function(input){ input.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); const key=input.dataset.chipInput; add(key,input.value); input.value=''; } }; });
}

function npHash(s){ let h=0; String(s||'').split('').forEach(function(c){ h=(h*31+c.charCodeAt(0))>>>0; }); return h; }
function npCover(b){
  if(b&&b.cover) return b.cover;

  const p=palettes[npHash((b&&b.title)||'书')%palettes.length];
  const title=String((b&&b.title)||'未命名').replace(/[<>&]/g,'');
  const lines=title.length>10? [title.slice(0,9),title.slice(9,18)] : [title];
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480">'
    +'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+p[0]+'"/><stop offset="1" stop-color="'+p[1]+'"/></linearGradient></defs>'
    +'<rect width="360" height="480" rx="12" fill="url(#g)"/><rect x="18" y="18" width="324" height="444" rx="6" fill="none" stroke="rgba(255,255,255,.42)"/>'
    +'<text x="34" y="150" fill="rgba(255,255,255,.95)" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">'+lines.map(function(x,i){ return '<tspan x="34" dy="'+(i?44:0)+'">'+x+'</tspan>'; }).join('')+'</text>'

    +'</svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function npJSON(raw){
  let s=String(raw||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  try{ return JSON.parse(s); }catch(e){}
  let a=s.indexOf('['),b=s.lastIndexOf(']');
  if(a>=0&&b>a){ try{ return JSON.parse(s.slice(a,b+1)); }catch(e){} }
  a=s.indexOf('{'); b=s.lastIndexOf('}');
  if(a>=0&&b>a){ try{ return JSON.parse(s.slice(a,b+1)); }catch(e){} }
  throw new Error('模型返回的内容不是可用格式');
}

function npParas(chapter){

function npMatches(b){

function npNormalizeBook(b){

  b.authorId=b.authorId||(isDemoItem(b)?'demo_ai':'me');

  b.genre=b.genre||'现代';
  b.tags=Array.isArray(b.tags)? b.tags:[];
  b.status=b.status||'连载中';
  b.origin=b.origin|| (b.demo?'demo':'import-reader');
  b.published=b.published!==false;
  b.protagonists=Array.isArray(b.protagonists)? b.protagonists:[];
  b.volumes=Array.isArray(b.volumes)?b.volumes:[];
  b.readerPrefs=b.readerPrefs||{};
  b.createdAt=Number(b.createdAt)||Number(b.created)||Date.now();
  b.updatedAt=Number(b.updatedAt)||b.createdAt;
  if(!Array.isArray(b.chapters)) b.chapters=npParseChapters(b.text||'',b.title||'正文');
  b.chapters.forEach(function(ch,i){
    ch.id=ch.id||('chap_'+b.id+'_'+i);
    ch.index=i;
    ch.title=ch.title||('第'+(i+1)+'章');
    ch.paras=npParas(ch);
    ch.content=ch.paras.join('\n');
    ch.words=Number(ch.words)||npWords(ch.content);
    ch.summary=ch.summary||String(ch.content||'').replace(/\s+/g,' ').slice(0,110);
    ch.comments=ch.comments||{};
    ch.reviewComments=Array.isArray(ch.reviewComments)?ch.reviewComments:[];
    ch.tips=Array.isArray(ch.tips)? ch.tips:[];
    ch.authorNote=ch.authorNote||'今天也写到这里。谢谢还在看的你。';
    ch.volumeId=ch.volumeId||'';
  });
  b.stats=Object.assign({reads:0,favorites:0,comments:0,tips:0,words:0,heat:0},b.stats||{});
  b.stats.words=npBookWords(b);
  b.stats.comments=(b.chapters||[]).reduce(function(s,c){ return s+Object.keys(c.comments||{}).reduce(function(n,k){ return n+(c.comments[k]||[]).length; },0); },0);
  b.stats.tips=(b.chapters||[]).reduce(function(s,c){ return s+(c.tips||[]).reduce(function(n,t){ return n+Number(t.amount||0); },0); },0);
  b.stats.heat=npHeat(b);
  b.coverCustom=npCoverIsCustom(b);
  if(!b.coverCustom) b.cover='';
  b.coverAuto=!b.coverCustom;
  return b;
}

function npParseNovelText(raw,filename){
  let text=String(raw||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const lines=text.split('\n');
  let title='',author='';
  lines.slice(0,10).forEach(function(line){
    const s=line.trim();
    let m=s.match(/^(?:书名|作品名)[:：]\s*(.+)$/); if(m&&!title) title=m[1].trim();
    m=s.match(/^(?:作者|作\s*者)[:：]\s*(.+)$/); if(m&&!author) author=m[1].trim();
  });
  const fn=filename? String(filename).replace(/\.txt$/i,''):'';
  if(!title) title=fn||'未命名';
  if(title.length>50) title=title.slice(0,50);
  if(!author) author='佚名';
  const heading=/^\s*(第[零一二三四五六七八九十百千万两0-9]+[章节回卷][^\n]{0,50}|Chapter\s+\d+[^\n]{0,50}|序章|楔子|尾声|番外[^\n]{0,30})\s*$/i;
  const chapters=[];
  let cur=null, preface=[];
  lines.forEach(function(line){
    const s=line.trim();
    if(/^(书名|作品名|作者|作\s*者)[:：]/.test(s)) return;
    if(heading.test(s)){
      if(cur) chapters.push(cur);
      cur={title:s,lines:[]};
    }else if(cur){ cur.lines.push(line); }
    else{ preface.push(line); }
  });
  if(cur) chapters.push(cur);
  if(!chapters.length){
    const content=preface.join('\n').trim();
    chapters.push({title:'正文',lines:content?content.split('\n'):[]});
  }else if(preface.join('').trim()){
    chapters.unshift({title:'序章',lines:preface});
  }
  return {title:title,author:author,chapters:chapters.map(function(c,i){
    const content=c.lines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
    return {id:uid(),index:i,title:c.title||('第'+(i+1)+'章'),content:content,paras:content.split(/\n+/).map(function(x){ return x.trim(); }).filter(Boolean),summary:String(content).replace(/\s+/g,' ').slice(0,110),comments:{},tips:[],authorNote:'',words:npWords(content)};
  })};
}
function npParseChapters(text,fallbackTitle){ return npParseNovelText(text,fallbackTitle).chapters; }
function npReadTextFile(file,cb){
  const fr=new FileReader();
  fr.onload=function(){
    const buf=fr.result;
    let text='';
    try{ text=new TextDecoder('utf-8',{fatal:false}).decode(buf); }catch(e){ text=String(buf); }
    const bad=(text.match(/\uFFFD/g)||[]).length;
    if(bad>20){
      try{ text=new TextDecoder('gb18030').decode(buf); }catch(e){}
    }
    cb(text);
  };
  fr.readAsArrayBuffer(file);
}
